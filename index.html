<!DOCTYPE html>
<html>
<head>
  <title>Tornadoz101 Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      background-color: #111;
      color: #f5f5f5;
      font-family: sans-serif;
    }

    /* Outer row: Left Menu | Right Column (Top Menu + Map) */
    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Full-height menu on the left */
    .left-menu {
      width: 240px;
      height: 100%;
      background-color: #1c1c1c;
      padding: 14px;
      border-right: 1px solid #333;
      overflow-y: auto;
    }

    /* Right side holds top menu on top and map below */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Top bar above the map */
    .top-menu {
      height: 56px;
      background-color: #1c1c1c;
      padding: 0 14px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: bold;
      margin: 0 0 12px 0;
    }

    .setting-box {
      background-color: #262626;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    /* Map fills everything below the top menu */
    #map {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- FULL-HEIGHT LEFT MENU -->
    <aside class="left-menu">
      <h2 class="panel-title">Side Menu</h2>
      <div class="setting-box">
        Settings go here
      </div>
    </aside>

    <!-- RIGHT SIDE: TOP MENU + MAP -->
    <div class="right-column">
      <header class="top-menu">
        <strong>Top Menu</strong>
        <span>Controls go here</span>
      </header>

      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([35.5, -97.5], 5);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);
  </script>
</body>
</html>
