<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tornadoz101's Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    :root {
      --panel-bg: #1e293b;
      --panel-text: #ffffff;
      --muted-text: #cbd5e1;
      --border-color: #000000;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --top-bar-bg: linear-gradient(to right, #1e293b 75%, #334155 100%);
      --input-bg: #0f172a;
      --input-text: #ffffff;
      --input-border: #64748b;
      --settings-icon: #cbd5e1;
      --settings-hover: #ffffff;
      --popup-bg: #1e293b;
      --popup-text: #ffffff;
      --site-unselected-bg: #475569;
      --site-unselected-border: #64748b;
      --site-unselected-text: #f1f5f9;
    }

    body.light-mode {
      --panel-bg: #ffffff;
      --panel-text: #111111;
      --muted-text: #6b7280;
      --border-color: #000000;
      --btn-bg: #ffffff;
      --btn-text: #111111;
      --top-bar-bg: linear-gradient(to right, #ffffff 75%, #e5e7eb 100%);
      --input-bg: #ffffff;
      --input-text: #111111;
      --input-border: #9ca3af;
      --settings-icon: #9ca3af;
      --settings-hover: #374151;
      --popup-bg: #ffffff;
      --popup-text: #111111;
      --site-unselected-bg: #e5e7eb;
      --site-unselected-border: #9ca3af;
      --site-unselected-text: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      font-family: sans-serif;
    }

    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    /* LEFT COLUMN */
    .left-column {
      width: 210px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      border-right: 3px solid var(--border-color);
      flex-shrink: 0;
    }

    .brand-box {
      height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--border-color);
      padding: 2px 8px;
      text-align: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--panel-text);
    }

    .brand-version {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-text);
      margin-top: 2px;
      line-height: 1;
    }

    .left-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 6px;
      min-height: 0;
      overflow-y: auto;
    }

    .empty-slots {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px 4px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted-text);
      margin-bottom: 4px;
    }

    .radar-site-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }

    .radar-site-btn {
      padding: 5px 6px;
      border-radius: 4px;
      border: 2px solid var(--site-unselected-border);
      background-color: var(--site-unselected-bg);
      color: var(--site-unselected-text);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .radar-site-btn.selected {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .radar-slot {
      min-height: 28px;
      font-size: 11px;
      font-weight: 700;
      color: var(--panel-text);
      line-height: 1.25;
    }

    .angle-slot {
      min-height: 44px;
    }

    .angle-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .angle-btn {
      padding: 3px 6px;
      font-size: 10px;
      font-weight: 800;
      border: 1.5px solid var(--input-border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
    }

    .angle-btn.active {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .scan-meta {
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted-text);
      line-height: 1.3;
    }

    .product-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .prod-btn {
      width: 100%;
      padding: 6px 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 800;
      border-radius: 0;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .prod-reflectivity {
      border-color: #1d4ed8;
    }

    .prod-reflectivity.active {
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .prod-velocity {
      border-color: #22c55e;
    }

    .prod-velocity.active {
      background-color: #22c55e;
      color: #052e16;
    }

    .prod-spectrum {
      border-color: #6b7280;
    }

    .prod-spectrum.active {
      background-color: #6b7280;
      color: #ffffff;
    }

    .prod-cc {
      border-color: #f43f5e;
    }

    .prod-cc.active {
      background-color: #f43f5e;
      color: #ffffff;
    }

    /* RIGHT COLUMN */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .top-bar {
      min-height: 56px;
      background: var(--top-bar-bg);
      color: var(--panel-text);
      border-bottom: 3px solid var(--border-color);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(96px, auto));
      grid-template-rows: repeat(2, auto);
      gap: 4px 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      padding: 3px 10px;
      border-radius: 999px;
      border: 2px solid #7cc4fa;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .top-center-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 140px;
    }

    .utc-clock {
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--panel-text);
      letter-spacing: 0.4px;
      line-height: 1;
    }

    .search-form {
      display: flex;
      width: 100%;
      max-width: 220px;
      height: 22px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      border: 2px solid var(--input-border);
      border-right: none;
      border-radius: 999px 0 0 999px;
      outline: none;
      background-color: var(--input-bg);
      color: var(--input-text);
    }

    .search-input:focus {
      border-color: #1d4ed8;
    }

    .search-go {
      padding: 0 9px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid #1d4ed8;
      border-radius: 0 999px 999px 0;
      background-color: #1d4ed8;
      color: #ffffff;
      cursor: pointer;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-right: 78px;
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--settings-icon);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .settings-btn:hover,
    .settings-btn.active {
      color: var(--settings-hover);
    }

    .map-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      background-color: #18181b;
    }

    .radar-marker-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #64748b;
      border: 2px solid #ffffff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
    }

    .radar-marker-icon.selected {
      background-color: #3b82f6;
      border-color: #ffffff;
      transform: scale(1.2);
    }

    .leaflet-tooltip.radar-site-label {
      background-color: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      border: 1px solid #38bdf8;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 800;
      box-shadow: none;
    }

    .popup-panel {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: 245px;
      min-height: 150px;
      background-color: var(--popup-bg);
      color: var(--popup-text);
      border: 3px solid var(--border-color);
      z-index: 1000;
      padding: 12px;
      font-size: 12px;
    }

    .popup-panel.open {
      display: block;
    }

    .settings-title {
      font-size: 13px;
      font-weight: 800;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .settings-title:first-child {
      margin-top: 0;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-row {
      display: flex;
      gap: 6px;
    }

    .opt-btn {
      flex: 1;
      width: 100%;
      padding: 7px 9px;
      border: 2px solid var(--input-border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .option-row .opt-btn {
      text-align: center;
    }

    .opt-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="left-column">
      <div class="brand-box">
        <div class="brand-title">Tornadoz101’s Radar</div>
        <div class="brand-version">Version 1.0</div>
      </div>

      <div class="left-body">
        <div class="empty-slots">
          <div>
            <div class="section-label">OK Primary Radars</div>
            <div class="radar-site-list" id="okRadarList"></div>
          </div>

          <div class="radar-slot" id="slot-radar-name">Select a radar site</div>

          <div class="angle-slot" id="slot-site-angles">
            <div class="section-label">Scan Angles</div>
            <div class="angle-grid" id="angleGrid"></div>
            <div class="scan-meta" id="scanMeta">Scan: -- | Status: Stand-by</div>
          </div>
        </div>

        <div class="product-buttons">
          <button type="button" class="prod-btn prod-reflectivity active" data-prod="ref">
            Reflectivity
          </button>
          <button type="button" class="prod-btn prod-velocity" data-prod="vel">
            Velocity
          </button>
          <button type="button" class="prod-btn prod-spectrum" data-prod="sw">
            Spectrum Width
          </button>
          <button type="button" class="prod-btn prod-cc" data-prod="cc">
            CC
          </button>
        </div>
      </div>
    </aside>

    <div class="right-column">
      <header class="top-bar">
        <div class="pill-grid">
          <button type="button" class="pill-btn" id="btnSiteNames">Site Names</button>
          <button type="button" class="pill-btn" id="btnAllVersion">All Version</button>
          <button type="button" class="pill-btn" id="btnReports">Reports</button>
          <button type="button" class="pill-btn" id="btnOutlook">Outlook</button>

          <button type="button" class="pill-btn active" id="btnWeatherVersion">Weather Version</button>
          <button type="button" class="pill-btn active" id="btnWarnings">Warnings</button>
          <button type="button" class="pill-btn" id="btnConfirmed">Confirmed</button>
          <button type="button" class="pill-btn" id="btnMD">MD</button>
        </div>

        <div class="top-center-stack">
          <div class="utc-clock" id="utcClock">--:--:-- UTC</div>
          <form class="search-form" id="searchForm">
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="Search city or state..."
            />
            <button type="submit" class="search-go">Go</button>
          </form>
        </div>

        <div class="top-right-group">
          <button type="button" class="settings-btn" id="btnSettings">Settings ⚙️</button>
        </div>
      </header>

      <div class="map-wrap">
        <div id="map"></div>

        <div class="popup-panel" id="settingsModal">
          <div class="settings-title">Theme</div>
          <div class="option-row">
            <button type="button" class="opt-btn active" id="themeDark">Dark</button>
            <button type="button" class="opt-btn" id="themeLight">Light</button>
          </div>

          <div class="settings-title">Map Style</div>
          <div class="option-group">
            <button type="button" class="opt-btn active" id="styleDarkMinimal">
              Dark Minimal (Default)
            </button>
            <button type="button" class="opt-btn" id="styleDetailedOSM">
              Detailed Street (OSM)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CARTO_API_KEY = "cb1_5fjg_1_351c53d02c76f010f2762ee8";

    const OK_PRIMARY_RADARS = [
      {
        id: "KTLX",
        name: "Oklahoma City / Norman, OK",
        lat: 35.3334,
        lon: -97.2779,
        wfo: "OUN",
        angles: ["0.5°", "0.9°", "1.3°", "1.8°", "2.4°", "3.1°"]
      },
      {
        id: "KVNX",
        name: "Vance AFB / Enid, OK",
        lat: 36.740617,
        lon: -98.127717,
        wfo: "OUN",
        angles: ["0.5°", "0.9°", "1.3°", "1.8°", "2.4°", "3.1°"]
      },
      {
        id: "KINX",
        name: "Tulsa / Inola, OK",
        lat: 36.1750,
        lon: -95.5640,
        wfo: "TSA",
        angles: ["0.5°", "0.9°", "1.3°", "1.8°", "2.4°", "3.1°"]
      },
      {
        id: "KFDR",
        name: "Frederick, OK",
        lat: 34.3622,
        lon: -98.9766,
        wfo: "OUN",
        angles: ["0.5°", "0.9°", "1.3°", "1.8°", "2.4°", "3.1°"]
      }
    ];

    let selectedRadarId = null;
    let selectedAngle = "0.5°";
    let selectedProduct = "ref";
    let siteNamesVisible = false;
    const radarMarkers = {};

    function applyThemeMode(themeName) {
      const isLight = themeName === "light";
      document.body.classList.toggle("light-mode", isLight);

      const darkBtn = document.getElementById("themeDark");
      const lightBtn = document.getElementById("themeLight");

      if (darkBtn) {
        darkBtn.classList.toggle("active", !isLight);
      }

      if (lightBtn) {
        lightBtn.classList.toggle("active", isLight);
      }

      try {
        localStorage.setItem("t101_theme_mode", isLight ? "light" : "dark");
      } catch (err) {
        // Ignore storage errors
      }
    }

    let savedTheme = "dark";
    try {
      savedTheme = localStorage.getItem("t101_theme_mode") || "dark";
    } catch (err) {
      savedTheme = "dark";
    }
    applyThemeMode(savedTheme);

    const themeDarkBtn = document.getElementById("themeDark");
    const themeLightBtn = document.getElementById("themeLight");

    if (themeDarkBtn) {
      themeDarkBtn.addEventListener("click", function () {
        applyThemeMode("dark");
      });
    }

    if (themeLightBtn) {
      themeLightBtn.addEventListener("click", function () {
        applyThemeMode("light");
      });
    }

    function updateUTCClock() {
      const clockEl = document.getElementById("utcClock");
      if (!clockEl) {
        return;
      }

      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, "0");
      const mm = String(now.getUTCMinutes()).padStart(2, "0");
      const ss = String(now.getUTCSeconds()).padStart(2, "0");
      clockEl.textContent = hh + ":" + mm + ":" + ss + " UTC";
    }

    updateUTCClock();
    setInterval(updateUTCClock, 1000);

    const btnSettings = document.getElementById("btnSettings");
    const settingsModal = document.getElementById("settingsModal");

    if (btnSettings && settingsModal) {
      btnSettings.addEventListener("click", function () {
        btnSettings.classList.toggle("active");
        settingsModal.classList.toggle("open");
      });
    }

    let mode = "weather";
    let warningsEnabled = true;
    let confirmedOnly = false;
    let map = null;
    let sampleWarnings = [];
    let darkMinimalLayer = null;
    let detailedOSMLayer = null;

    function makeBox(s, w, n, e, color, label) {
      return L.rectangle(
        [
          [s, w],
          [n, e]
        ],
        {
          color: color,
          fillColor: color,
          fillOpacity: 0.5,
          weight: 2
        }
      ).bindPopup(label);
    }

    function updateWarningsDisplay() {
      if (!map) {
        return;
      }

      sampleWarnings.forEach(function (item) {
        const modeMatch = mode === "all" || item.type === "weather";
        const confirmedMatch = !confirmedOnly || item.confirmed;
        const shouldShow = warningsEnabled && modeMatch && confirmedMatch;

        if (shouldShow && !map.hasLayer(item.layer)) {
          item.layer.addTo(map);
        } else if (!shouldShow && map.hasLayer(item.layer)) {
          map.removeLayer(item.layer);
        }
      });
    }

    function updateScanDetails(radarObj) {
      const nameSlot = document.getElementById("slot-radar-name");
      const angleGrid = document.getElementById("angleGrid");
      const scanMeta = document.getElementById("scanMeta");

      if (!radarObj) {
        if (nameSlot) {
          nameSlot.textContent = "Select a radar site";
        }
        if (angleGrid) {
          angleGrid.innerHTML = "";
        }
        if (scanMeta) {
          scanMeta.textContent = "Scan: -- | Status: Stand-by";
        }
        return;
      }

      if (nameSlot) {
        nameSlot.innerHTML =
          "<strong>" + radarObj.id + "</strong> — " + radarObj.name +
          "<br><span style='color:var(--muted-text);font-size:10px;'>WFO: " + radarObj.wfo + "</span>";
      }

      if (angleGrid) {
        angleGrid.innerHTML = "";
        radarObj.angles.forEach(function (ang) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "angle-btn" + (ang === selectedAngle ? " active" : "");
          btn.textContent = ang;
          btn.addEventListener("click", function () {
            selectedAngle = ang;
            updateScanDetails(radarObj);
          });
          angleGrid.appendChild(btn);
        });
      }

      if (scanMeta) {
        scanMeta.textContent =
          "Tilt: " + selectedAngle + " | Product: " + selectedProduct.toUpperCase();
      }
    }

    function refreshRadarUI() {
      const buttons = document.querySelectorAll(".radar-site-btn");
      buttons.forEach(function (btn) {
        const isSelected = btn.getAttribute("data-site") === selectedRadarId;
        btn.classList.toggle("selected", isSelected);
      });

      Object.keys(radarMarkers).forEach(function (siteId) {
        const marker = radarMarkers[siteId];
        const isSelected = siteId === selectedRadarId;
        const iconEl = marker.getElement();
        if (iconEl) {
          const dot = iconEl.querySelector(".radar-marker-icon");
          if (dot) {
            dot.classList.toggle("selected", isSelected);
          }
        }
        if (siteNamesVisible) {
          if (!marker.getTooltip()) {
            marker.bindTooltip(siteId, {
              permanent: true,
              direction: "top",
              offset: [0, -8],
              className: "radar-site-label"
            });
          }
          marker.openTooltip();
        } else if (marker.getTooltip()) {
          marker.unbindTooltip();
        }
      });

      const activeObj = OK_PRIMARY_RADARS.find(function (r) {
        return r.id === selectedRadarId;
      }) || null;
      updateScanDetails(activeObj);
    }

    function selectRadarSite(siteId) {
      selectedRadarId = siteId;
      refreshRadarUI();
    }

    function buildRadarButtons() {
      const container = document.getElementById("okRadarList");
      if (!container) {
        return;
      }
      container.innerHTML = "";

      OK_PRIMARY_RADARS.forEach(function (radar) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "radar-site-btn";
        btn.setAttribute("data-site", radar.id);
        btn.textContent = radar.id;
        btn.title = radar.name;
        btn.addEventListener("click", function () {
          selectRadarSite(radar.id);
        });
        container.appendChild(btn);
      });
    }

    function applyMapStyle(styleName) {
      if (!map || !darkMinimalLayer || !detailedOSMLayer) {
        return;
      }

      const darkBtn = document.getElementById("styleDarkMinimal");
      const osmBtn = document.getElementById("styleDetailedOSM");

      if (styleName === "detailed") {
        if (map.hasLayer(darkMinimalLayer)) {
          map.removeLayer(darkMinimalLayer);
        }
        if (!map.hasLayer(detailedOSMLayer)) {
          detailedOSMLayer.addTo(map);
        }
        if (osmBtn) {
          osmBtn.classList.add("active");
        }
        if (darkBtn) {
          darkBtn.classList.remove("active");
        }
      } else {
        if (map.hasLayer(detailedOSMLayer)) {
          map.removeLayer(detailedOSMLayer);
        }
        if (!map.hasLayer(darkMinimalLayer)) {
          darkMinimalLayer.addTo(map);
        }
        if (darkBtn) {
          darkBtn.classList.add("active");
        }
        if (osmBtn) {
          osmBtn.classList.remove("active");
        }
      }

      try {
        localStorage.setItem("t101_map_style", styleName);
      } catch (err) {
        // Ignore storage errors
      }
    }

    buildRadarButtons();

    const btnSiteNames = document.getElementById("btnSiteNames");
    if (btnSiteNames) {
      btnSiteNames.addEventListener("click", function () {
        siteNamesVisible = !siteNamesVisible;
        btnSiteNames.classList.toggle("active", siteNamesVisible);
        refreshRadarUI();
      });
    }

    const btnWeatherVersion = document.getElementById("btnWeatherVersion");
    const btnAllVersion = document.getElementById("btnAllVersion");
    const btnWarnings = document.getElementById("btnWarnings");
    const btnConfirmed = document.getElementById("btnConfirmed");

    if (btnWeatherVersion && btnAllVersion) {
      btnWeatherVersion.addEventListener("click", function () {
        mode = "weather";
        btnWeatherVersion.classList.add("active");
        btnAllVersion.classList.remove("active");
        updateWarningsDisplay();
      });

      btnAllVersion.addEventListener("click", function () {
        mode = "all";
        btnAllVersion.classList.add("active");
        btnWeatherVersion.classList.remove("active");
        updateWarningsDisplay();
      });
    }

    if (btnWarnings) {
      btnWarnings.addEventListener("click", function () {
        warningsEnabled = !warningsEnabled;
        btnWarnings.classList.toggle("active", warningsEnabled);
        updateWarningsDisplay();
      });
    }

    if (btnConfirmed) {
      btnConfirmed.addEventListener("click", function () {
        confirmedOnly = !confirmedOnly;
        btnConfirmed.classList.toggle("active", confirmedOnly);
        updateWarningsDisplay();
      });
    }

    ["btnReports", "btnOutlook", "btnMD"].forEach(function (id) {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener("click", function () {
          btn.classList.toggle("active");
        });
      }
    });

    const prodButtons = document.querySelectorAll(".prod-btn");
    prodButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        prodButtons.forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        selectedProduct = btn.getAttribute("data-prod") || "ref";
        const activeObj = OK_PRIMARY_RADARS.find(function (r) {
          return r.id === selectedRadarId;
        }) || null;
        updateScanDetails(activeObj);
      });
    });

    if (typeof L !== "undefined") {
      map = L.map("map").setView([35.55, -97.45], 7);

      const cleanKey = CARTO_API_KEY.trim();
      const cartoUrl = cleanKey
        ? "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=" +
          encodeURIComponent(cleanKey)
        : "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png";

      darkMinimalLayer = L.tileLayer(cartoUrl, {
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
        maxZoom: 20
      });

      detailedOSMLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      });

      let savedStyle = "dark";
      try {
        savedStyle = localStorage.getItem("t101_map_style") || "dark";
      } catch (err) {
        savedStyle = "dark";
      }
      applyMapStyle(savedStyle);

      OK_PRIMARY_RADARS.forEach(function (radar) {
        const divIcon = L.divIcon({
          className: "",
          html: '<div class="radar-marker-icon"></div>',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        const marker = L.marker([radar.lat, radar.lon], { icon: divIcon })
          .addTo(map)
          .bindPopup(
            "<strong>" + radar.id + "</strong><br>" +
            radar.name + "<br>" +
            "Coords: " + radar.lat.toFixed(3) + ", " + radar.lon.toFixed(3)
          );

        marker.on("click", function () {
          selectRadarSite(radar.id);
        });

        radarMarkers[radar.id] = marker;
      });

      refreshRadarUI();

      const styleDarkBtn = document.getElementById("styleDarkMinimal");
      const styleOSMBtn = document.getElementById("styleDetailedOSM");

      if (styleDarkBtn) {
        styleDarkBtn.addEventListener("click", function () {
          applyMapStyle("dark");
        });
      }

      if (styleOSMBtn) {
        styleOSMBtn.addEventListener("click", function () {
          applyMapStyle("detailed");
        });
      }

      sampleWarnings = [
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.390, -98.02, 35.425, -97.96, "#ffea00", "Severe Thunderstorm Warning (Base)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.350, -98.02, 35.385, -97.96, "#d4ac0d", "Severe Thunderstorm Warning (Considerable)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -98.02, 35.345, -97.96, "#8a6d00", "Severe Thunderstorm Warning (Destructive)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -97.95, 35.425, -97.89, "#e60000", "Tornado Warning")
        },
        {
          type: "weather",
          confirmed: true,
          layer: makeBox(35.310, -97.88, 35.425, -97.82, "#800000", "Tornado Warning (PDS)")
        },
        {
          type: "weather",
          confirmed: true,
          layer: makeBox(35.310, -97.81, 35.425, -97.75, "#d946ef", "Tornado Emergency")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -97.74, 35.425, -97.68, "#16a34a", "Flood Warning")
        },
        {
          type: "other",
          confirmed: false,
          layer: makeBox(35.310, -97.67, 35.425, -97.61, "#ff4da6", "Snow Warning")
        },
        {
          type: "other",
          confirmed: false,
          layer: makeBox(35.310, -97.60, 35.425, -97.54, "#a855f7", "Wind / Gale Warning")
        }
      ];

      updateWarningsDisplay();

      const searchForm = document.getElementById("searchForm");
      if (searchForm) {
        searchForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const input = document.getElementById("searchInput");
          const query = input ? input.value.trim() : "";
          if (!query) {
            return;
          }

          fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(query))
            .then(function (res) {
              return res.json();
            })
            .then(function (results) {
              if (results && results.length > 0 && map) {
                map.setView([parseFloat(results[0].lat), parseFloat(results[0].lon)], 10);
              }
            })
            .catch(function () {
              // Ignore network errors
            });
        });
      }
    }
  </script>
</body>
</html>
