<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tornadoz101's Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    :root {
      --panel-bg: #1e293b;
      --panel-text: #ffffff;
      --muted-text: #cbd5e1;
      --border-color: #000000;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --top-bar-bg: linear-gradient(to right, #1e293b 75%, #334155 100%);
      --input-bg: #0f172a;
      --input-text: #ffffff;
      --input-border: #64748b;
      --settings-icon: #cbd5e1;
      --settings-hover: #ffffff;
      --popup-bg: #1e293b;
      --popup-text: #ffffff;
      --disclaimer-text: #ef4444;
      --accent-blue: #38bdf8;
      --elev-active-bg: rgba(56, 189, 248, 0.18);
      --status-card-bg: rgba(15, 23, 42, 0.96);
      --status-amber: #f59e0b;
      --status-amber-soft: rgba(245, 158, 11, 0.14);
      --backdrop-bg: rgba(2, 6, 23, 0.55);
    }

    body.light-mode {
      --panel-bg: #ffffff;
      --panel-text: #111111;
      --muted-text: #6b7280;
      --border-color: #000000;
      --btn-bg: #ffffff;
      --btn-text: #111111;
      --top-bar-bg: linear-gradient(to right, #ffffff 75%, #e5e7eb 100%);
      --input-bg: #ffffff;
      --input-text: #111111;
      --input-border: #9ca3af;
      --settings-icon: #9ca3af;
      --settings-hover: #374151;
      --popup-bg: #ffffff;
      --popup-text: #111111;
      --disclaimer-text: #dc2626;
      --accent-blue: #0284c7;
      --elev-active-bg: #f1f5f9;
      --status-card-bg: rgba(255, 255, 255, 0.98);
      --status-amber: #d97706;
      --status-amber-soft: rgba(217, 119, 6, 0.12);
      --backdrop-bg: rgba(15, 23, 42, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      font-family: sans-serif;
    }

    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    /* LEFT COLUMN */
    .left-column {
      width: 235px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      border-right: 3px solid var(--border-color);
      flex-shrink: 0;
    }

    .brand-box {
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--border-color);
      padding: 4px 8px;
      text-align: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--panel-text);
    }

    .brand-version {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-text);
      margin-top: 2px;
      line-height: 1;
    }

    .brand-disclaimer {
      font-size: 8px;
      font-weight: 800;
      color: var(--disclaimer-text);
      margin-top: 4px;
      line-height: 1.15;
      letter-spacing: 0.2px;
    }

    .left-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 8px;
      min-height: 0;
      overflow-y: auto;
    }

    .empty-slots {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* FILE / FRAME PLAYER CARD */
    .player-card {
      border-bottom: 1px solid var(--input-border);
      padding-bottom: 8px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-text);
      padding-bottom: 3px;
      border-bottom: 1px solid var(--input-border);
      margin-bottom: 5px;
    }

    .player-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--panel-text);
      margin-bottom: 8px;
    }

    .player-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 165px;
    }

    .player-frame-count {
      color: var(--muted-text);
      flex-shrink: 0;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .step-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
    }

    .step-btn:hover {
      opacity: 0.8;
    }

    .play-circle-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent-blue);
      background: transparent;
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .play-circle-btn.playing {
      background-color: var(--accent-blue);
      color: #0f172a;
    }

    /* ELEVATIONS GRID */
    .elev-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .elev-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--panel-text);
    }

    .load-loop-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .load-loop-btn:hover {
      text-decoration: underline;
    }

    .elev-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px 4px;
    }

    .elev-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-blue);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .elev-item.active {
      background-color: var(--elev-active-bg);
    }

    .elev-badge {
      position: absolute;
      top: 1px;
      right: 4px;
      font-size: 8.5px;
      font-weight: 700;
      color: var(--muted-text);
      border: 1px solid var(--input-border);
      background-color: var(--panel-bg);
      border-radius: 3px;
      padding: 0 3px;
      line-height: 1.2;
    }

    .radar-status-note {
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted-text);
      line-height: 1.3;
    }

    .product-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .prod-btn {
      width: 100%;
      padding: 6px 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 800;
      border-radius: 0;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .prod-reflectivity {
      border-color: #1d4ed8;
    }

    .prod-reflectivity.active {
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .prod-velocity {
      border-color: #22c55e;
    }

    .prod-velocity.active {
      background-color: #22c55e;
      color: #052e16;
    }

    .prod-spectrum {
      border-color: #6b7280;
    }

    .prod-spectrum.active {
      background-color: #6b7280;
      color: #ffffff;
    }

    .prod-cc {
      border-color: #f43f5e;
    }

    .prod-cc.active {
      background-color: #f43f5e;
      color: #ffffff;
    }

    /* RIGHT COLUMN */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .top-bar {
      min-height: 76px;
      background: var(--top-bar-bg);
      color: var(--panel-text);
      border-bottom: 3px solid var(--border-color);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(96px, auto));
      grid-template-rows: repeat(2, auto);
      gap: 4px 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      padding: 3px 10px;
      border-radius: 999px;
      border: 2px solid #7cc4fa;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .top-center-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 140px;
    }

    .utc-clock {
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--panel-text);
      letter-spacing: 0.4px;
      line-height: 1;
    }

    .search-form {
      display: flex;
      width: 100%;
      max-width: 220px;
      height: 22px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      border: 2px solid var(--input-border);
      border-right: none;
      border-radius: 999px 0 0 999px;
      outline: none;
      background-color: var(--input-bg);
      color: var(--input-text);
    }

    .search-input:focus {
      border-color: #1d4ed8;
    }

    .search-go {
      padding: 0 9px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid #1d4ed8;
      border-radius: 0 999px 999px 0;
      background-color: #1d4ed8;
      color: #ffffff;
      cursor: pointer;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-right: 78px;
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--settings-icon);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .settings-btn:hover,
    .settings-btn.active {
      color: var(--settings-hover);
    }

    .map-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      background-color: #18181b;
    }

    .live-scan-overlay-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 360;
      opacity: 0.78;
      display: none;
    }

    .live-scan-overlay-img.visible {
      display: block;
    }

    .map-site-text {
      display: inline-block;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .map-site-text.selected {
      color: #3b82f6;
    }

    /* SITE INACTIVE / MAINTENANCE MODAL (ONLY SHOWN ON CLICKING AN INACTIVE SITE) */
    .site-status-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background-color: var(--backdrop-bg);
      backdrop-filter: blur(2px);
      z-index: 1200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .site-status-backdrop.open {
      display: flex;
    }

    .site-status-card {
      width: 100%;
      max-width: 390px;
      background-color: var(--status-card-bg);
      color: var(--panel-text);
      border: 2px solid var(--input-border);
      border-radius: 10px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      padding: 16px 18px;
    }

    .site-status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .site-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--status-amber);
      background-color: var(--status-amber-soft);
      border: 1px solid var(--status-amber);
      border-radius: 999px;
      padding: 3px 9px;
    }

    .site-status-close {
      background: none;
      border: none;
      color: var(--muted-text);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
    }

    .site-status-close:hover {
      color: var(--panel-text);
    }

    .site-status-heading {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 4px 0;
      color: var(--panel-text);
    }

    .site-status-sub {
      font-size: 12px;
      color: var(--muted-text);
      margin: 0 0 12px 0;
    }

    .site-status-reason-box {
      background-color: var(--btn-bg);
      border: 1px solid var(--input-border);
      border-left: 4px solid var(--status-amber);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .site-status-reason-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--status-amber);
      margin-bottom: 4px;
    }

    .site-status-reason-text {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--panel-text);
      margin: 0;
    }

    .site-status-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .status-action-btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--input-border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .status-action-btn.primary {
      border-color: var(--accent-blue);
      background-color: var(--accent-blue);
      color: #0f172a;
    }

    .popup-panel {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: 245px;
      min-height: 150px;
      background-color: var(--popup-bg);
      color: var(--popup-text);
      border: 3px solid var(--border-color);
      z-index: 1000;
      padding: 12px;
      font-size: 12px;
    }

    .popup-panel.open {
      display: block;
    }

    .settings-title {
      font-size: 13px;
      font-weight: 800;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .settings-title:first-child {
      margin-top: 0;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-row {
      display: flex;
      gap: 6px;
    }

    .opt-btn {
      flex: 1;
      width: 100%;
      padding: 7px 9px;
      border: 2px solid var(--input-border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .option-row .opt-btn {
      text-align: center;
    }

    .opt-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="left-column">
      <div class="brand-box">
        <div class="brand-title">Tornadoz101’s Radar</div>
        <div class="brand-version">Version 1.1</div>
        <div class="brand-disclaimer">
          <strong>SCANS ARE THE LATEST AVAILABLE, MAY NOT BE DIRECTLY UP TO DATE</strong>
        </div>
      </div>

      <div class="left-body">
        <div class="empty-slots">
          <div class="player-card">
            <div class="player-header">
              <span>File</span>
              <span>Frame</span>
            </div>
            <div class="player-info-row">
              <span class="player-file-name" id="scanFileName">Starting poll...</span>
              <span class="player-frame-count" id="scanFrameCount">0/0</span>
            </div>
            <div class="player-controls">
              <button type="button" class="step-btn" id="btnPrevFrame" title="Previous Scan">&lt;</button>
              <button type="button" class="play-circle-btn" id="btnPlayLoop" title="Play / Pause Loop">&#9654;</button>
              <button type="button" class="step-btn" id="btnNextFrame" title="Next Scan">&gt;</button>
            </div>
          </div>

          <div>
            <div class="elev-section-header">
              <span class="elev-title" id="elevHeaderTitle">KTLX elevations</span>
              <button type="button" class="load-loop-btn" id="btnRefreshScans">Collect Now</button>
            </div>
            <div class="elev-grid" id="elevGrid"></div>
            <div class="radar-status-note" id="radarFeedStatus">
              Polling every 60s • 10m batch: 0 new
            </div>
          </div>
        </div>

        <div class="product-buttons">
          <button type="button" class="prod-btn prod-reflectivity active" data-prod="ref">
            Reflectivity
          </button>
          <button type="button" class="prod-btn prod-velocity" data-prod="vel">
            Velocity
          </button>
          <button type="button" class="prod-btn prod-spectrum" data-prod="sw">
            Spectrum Width
          </button>
          <button type="button" class="prod-btn prod-cc" data-prod="cc">
            CC
          </button>
        </div>
      </div>
    </aside>

    <div class="right-column">
      <header class="top-bar">
        <div class="pill-grid">
          <button type="button" class="pill-btn active" id="btnSiteNames">Site Names</button>
          <button type="button" class="pill-btn" id="btnAllVersion">All Version</button>
          <button type="button" class="pill-btn" id="btnReports">Reports</button>
          <button type="button" class="pill-btn" id="btnOutlook">Outlook</button>

          <button type="button" class="pill-btn active" id="btnWeatherVersion">Weather Version</button>
          <button type="button" class="pill-btn active" id="btnWarnings">Warnings</button>
          <button type="button" class="pill-btn" id="btnConfirmed">Confirmed</button>
          <button type="button" class="pill-btn" id="btnMD">MD</button>
        </div>

        <div class="top-center-stack">
          <div class="utc-clock" id="utcClock">--:--:-- UTC</div>
          <form class="search-form" id="searchForm">
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="Search city or state..."
            />
            <button type="submit" class="search-go">Go</button>
          </form>
        </div>

        <div class="top-right-group">
          <button type="button" class="settings-btn" id="btnSettings">Settings ⚙️</button>
        </div>
      </header>

      <div class="map-wrap">
        <div id="map"></div>
        <img id="liveScanImg" class="live-scan-overlay-img" alt="Live Radar Scan Frame" />

        <div class="site-status-backdrop" id="siteStatusModal" role="dialog" aria-modal="true" aria-labelledby="siteStatusHeading">
          <div class="site-status-card">
            <div class="site-status-top">
              <span class="site-status-badge" id="siteStatusBadge">Scan Feed Check</span>
              <button type="button" class="site-status-close" id="btnCloseSiteStatus" title="Close">&times;</button>
            </div>
            <h3 class="site-status-heading" id="siteStatusHeading">Radar Site Unavailable</h3>
            <p class="site-status-sub" id="siteStatusSub"></p>
            <div class="site-status-reason-box">
              <div class="site-status-reason-title" id="siteStatusReasonTitle">Why This Appeared</div>
              <p class="site-status-reason-text" id="siteStatusReasonText"></p>
            </div>
            <div class="site-status-actions">
              <button type="button" class="status-action-btn" id="btnRetrySiteStatus">Retry Check</button>
              <button type="button" class="status-action-btn primary" id="btnDismissSiteStatus">Got It</button>
            </div>
          </div>
        </div>

        <div class="popup-panel" id="settingsModal">
          <div class="settings-title">Theme</div>
          <div class="option-row">
            <button type="button" class="opt-btn active" id="themeDark">Dark</button>
            <button type="button" class="opt-btn" id="themeLight">Light</button>
          </div>

          <div class="settings-title">Map Style</div>
          <div class="option-group">
            <button type="button" class="opt-btn active" id="styleDarkMinimal">
              Dark Minimal (Default)
            </button>
            <button type="button" class="opt-btn" id="styleDetailedOSM">
              Detailed Street (OSM)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CARTO_API_KEY = "cb1_5fjg_1_351c53d02c76f010f2762ee8";
    const MAX_LOOP_FRAMES = 10;
    const POLL_INTERVAL_MS = 60000;      // Constantly check for new scans every 60s
    const BATCH_WINDOW_MS = 600000;      // Deliver collected new scans every 10 minutes (600,000 ms)

    const OK_PRIMARY_RADARS = [
      { id: "KTLX", sector: "TLX", name: "Oklahoma City / Norman, OK", lat: 35.3334, lon: -97.2779 },
      { id: "KVNX", sector: "VNX", name: "Vance AFB / Enid, OK", lat: 36.740617, lon: -98.127717 },
      { id: "KINX", sector: "INX", name: "Tulsa / Inola, OK", lat: 36.1750, lon: -95.5640 },
      { id: "KFDR", sector: "FDR", name: "Frederick, OK", lat: 34.3622, lon: -98.9766 }
    ];

    const ELEVATION_LEVELS = [
      { angle: "0.5°", code: "0" },
      { angle: "0.9°", code: "1" },
      { angle: "1.3°", code: "2" },
      { angle: "1.8°", code: "3" },
      { angle: "2.4°", code: "0" },
      { angle: "3.1°", code: "0" },
      { angle: "4.0°", code: "0" },
      { angle: "5.1°", code: "0" },
      { angle: "6.4°", code: "0" }
    ];

    const PRODUCT_PREFIX = {
      ref: "N",
      vel: "N",
      sw: "N",
      cc: "N"
    };

    const PRODUCT_SUFFIX = {
      ref: "Q",
      vel: "U",
      sw: "S",
      cc: "C"
    };

    let selectedRadarId = "KTLX";
    let selectedElevation = ELEVATION_LEVELS[0];
    let selectedProductKey = "ref";
    let siteNamesVisible = true;
    const radarNameLayers = {};

    // Rolling saved scan frames (capped at MAX_LOOP_FRAMES; oldest cut out first)
    let savedScanFrames = [];
    // Staging buffer of unique scans collected during the current 10-minute window
    let tenMinuteStagingQueue = [];
    let lastTenMinDeliverCount = 0;

    let currentFrameIndex = 0;
    let isPlaying = false;
    let playTimer = null;
    let pollCounter = 0;

    // Track seen scan signatures so identical/repeated scans are rejected
    const seenScanSignatures = new Set();

    function getActiveRadarObj() {
      return OK_PRIMARY_RADARS.find(function (r) {
        return r.id === selectedRadarId;
      }) || OK_PRIMARY_RADARS[0];
    }

    function getRidgeProductCode() {
      const prefix = PRODUCT_PREFIX[selectedProductKey] || "N";
      const suffix = PRODUCT_SUFFIX[selectedProductKey] || "Q";
      const tiltCode = selectedElevation ? selectedElevation.code : "0";
      return prefix + tiltCode + suffix;
    }

    function openInactiveSiteModal(radarObj, issueType, reasonDetail) {
      const modal = document.getElementById("siteStatusModal");
      const badge = document.getElementById("siteStatusBadge");
      const heading = document.getElementById("siteStatusHeading");
      const sub = document.getElementById("siteStatusSub");
      const reasonTitle = document.getElementById("siteStatusReasonTitle");
      const reasonText = document.getElementById("siteStatusReasonText");

      if (badge) {
        badge.textContent = issueType === "maintenance" ? "Possible Maintenance / Offline" : "Scan Feed Issue";
      }
      if (heading) {
        heading.textContent = radarObj.id + " Scan Feed Unavailable";
      }
      if (sub) {
        sub.textContent = radarObj.name;
      }
      if (reasonTitle) {
        reasonTitle.textContent = "Why This Appeared";
      }
      if (reasonText) {
        reasonText.textContent = reasonDetail;
      }
      if (modal) {
        modal.classList.add("open");
      }
    }

    function closeInactiveSiteModal() {
      const modal = document.getElementById("siteStatusModal");
      if (modal) {
        modal.classList.remove("open");
      }
    }

    function applyThemeMode(themeName) {
      const isLight = themeName === "light";
      document.body.classList.toggle("light-mode", isLight);

      const darkBtn = document.getElementById("themeDark");
      const lightBtn = document.getElementById("themeLight");

      if (darkBtn) {
        darkBtn.classList.toggle("active", !isLight);
      }

      if (lightBtn) {
        lightBtn.classList.toggle("active", isLight);
      }

      try {
        localStorage.setItem("t101_theme_mode", isLight ? "light" : "dark");
      } catch (err) {
        // Ignore storage errors
      }
    }

    let savedTheme = "dark";
    try {
      savedTheme = localStorage.getItem("t101_theme_mode") || "dark";
    } catch (err) {
      savedTheme = "dark";
    }
    applyThemeMode(savedTheme);

    const themeDarkBtn = document.getElementById("themeDark");
    const themeLightBtn = document.getElementById("themeLight");

    if (themeDarkBtn) {
      themeDarkBtn.addEventListener("click", function () {
        applyThemeMode("dark");
      });
    }

    if (themeLightBtn) {
      themeLightBtn.addEventListener("click", function () {
        applyThemeMode("light");
      });
    }

    function updateUTCClock() {
      const clockEl = document.getElementById("utcClock");
      if (!clockEl) {
        return;
      }

      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, "0");
      const mm = String(now.getUTCMinutes()).padStart(2, "0");
      const ss = String(now.getUTCSeconds()).padStart(2, "0");
      clockEl.textContent = hh + ":" + mm + ":" + ss + " UTC";
    }

    updateUTCClock();
    setInterval(updateUTCClock, 1000);

    const btnSettings = document.getElementById("btnSettings");
    const settingsModal = document.getElementById("settingsModal");

    if (btnSettings && settingsModal) {
      btnSettings.addEventListener("click", function () {
        btnSettings.classList.toggle("active");
        settingsModal.classList.toggle("open");
      });
    }

    const btnCloseSiteStatus = document.getElementById("btnCloseSiteStatus");
    const btnDismissSiteStatus = document.getElementById("btnDismissSiteStatus");
    const btnRetrySiteStatus = document.getElementById("btnRetrySiteStatus");
    const siteStatusModal = document.getElementById("siteStatusModal");

    if (btnCloseSiteStatus) {
      btnCloseSiteStatus.addEventListener("click", closeInactiveSiteModal);
    }
    if (btnDismissSiteStatus) {
      btnDismissSiteStatus.addEventListener("click", closeInactiveSiteModal);
    }
    if (siteStatusModal) {
      siteStatusModal.addEventListener("click", function (e) {
        if (e.target === siteStatusModal) {
          closeInactiveSiteModal();
        }
      });
    }
    if (btnRetrySiteStatus) {
      btnRetrySiteStatus.addEventListener("click", function () {
        closeInactiveSiteModal();
        pollForNewScan(true, true);
      });
    }

    let mode = "weather";
    let warningsEnabled = true;
    let confirmedOnly = false;
    let map = null;
    let sampleWarnings = [];
    let darkMinimalLayer = null;
    let detailedOSMLayer = null;

    function makeBox(s, w, n, e, color, label) {
      return L.rectangle(
        [
          [s, w],
          [n, e]
        ],
        {
          color: color,
          fillColor: color,
          fillOpacity: 0.5,
          weight: 2
        }
      ).bindPopup(label);
    }

    function updateWarningsDisplay() {
      if (!map) {
        return;
      }

      sampleWarnings.forEach(function (item) {
        const modeMatch = mode === "all" || item.type === "weather";
        const confirmedMatch = !confirmedOnly || item.confirmed;
        const shouldShow = warningsEnabled && modeMatch && confirmedMatch;

        if (shouldShow && !map.hasLayer(item.layer)) {
          item.layer.addTo(map);
        } else if (!shouldShow && map.hasLayer(item.layer)) {
          map.removeLayer(item.layer);
        }
      });
    }

    /* =========================================================================
       SCAN FINGERPRINTING, DEDUPLICATION, ROLLING CAP & 10-MINUTE BATCHING
       ========================================================================= */
    function computeBlobFingerprint(blob) {
      return blob.arrayBuffer().then(function (buf) {
        const bytes = new Uint8Array(buf);
        let hash = 2166136261;
        const step = Math.max(1, Math.floor(bytes.length / 4096));
        for (let i = 0; i < bytes.length; i += step) {
          hash ^= bytes[i];
          hash = Math.imul(hash, 16777619);
        }
        return bytes.length + ":" + (hash >>> 0).toString(16);
      });
    }

    function pushScanWithRollingCap(targetArray, scanItem) {
      targetArray.push(scanItem);
      while (targetArray.length > MAX_LOOP_FRAMES) {
        const removed = targetArray.shift();
        if (removed && removed.objectUrl) {
          URL.revokeObjectURL(removed.objectUrl);
        }
      }
    }

    function flushTenMinuteBatchIntoSavedLoop() {
      const collectedCount = tenMinuteStagingQueue.length;
      lastTenMinDeliverCount = collectedCount;

      if (collectedCount > 0) {
        while (tenMinuteStagingQueue.length > 0) {
          const item = tenMinuteStagingQueue.shift();
          pushScanWithRollingCap(savedScanFrames, item);
        }
        currentFrameIndex = savedScanFrames.length - 1;
      }

      renderPlayerAndElevations();
      displayCurrentSavedFrame();
    }

    function displayCurrentSavedFrame() {
      const imgEl = document.getElementById("liveScanImg");
      const frame = savedScanFrames[currentFrameIndex] || null;

      if (!imgEl) {
        return;
      }

      if (frame && frame.objectUrl) {
        imgEl.src = frame.objectUrl;
        imgEl.classList.add("visible");
      } else {
        imgEl.removeAttribute("src");
        imgEl.classList.remove("visible");
      }
    }

    function buildLiveRidgeRequestUrl(radarObj, ridgeProd) {
      pollCounter++;
      const uniqueNonce = Date.now() + "_" + pollCounter + "_" + Math.random().toString(36).slice(2, 8);
      return (
        "https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/ridge.cgi" +
        "?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap" +
        "&LAYERS=single" +
        "&STYLES=" +
        "&FORMAT=image/png" +
        "&TRANSPARENT=true" +
        "&SRS=EPSG:4326" +
        "&BBOX=-103.5,33.5,-94.0,37.5" +
        "&WIDTH=1024&HEIGHT=512" +
        "&sector=" + encodeURIComponent(radarObj.sector) +
        "&prod=" + encodeURIComponent(ridgeProd) +
        "&_t=" + encodeURIComponent(uniqueNonce)
      );
    }

    function pollForNewScan(deliverImmediately, userClickedSite) {
      const radarObj = getActiveRadarObj();
      const ridgeProd = getRidgeProductCode();
      const url = buildLiveRidgeRequestUrl(radarObj, ridgeProd);

      fetch(url, { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) {
            throw new Error("HTTP " + res.status);
          }
          const contentType = res.headers.get("content-type") || "";
          if (contentType.indexOf("image") === -1) {
            throw new Error("Non-image response");
          }
          return res.blob();
        })
        .then(function (blob) {
          if (!blob || blob.size < 250) {
            throw new Error("Empty or no-data radar tile");
          }

          return computeBlobFingerprint(blob).then(function (sig) {
            const fullSig = radarObj.sector + "|" + ridgeProd + "|" + sig;
            if (seenScanSignatures.has(fullSig)) {
              // Exact duplicate scan frame — do not re-add the same scan again
              renderPlayerAndElevations();
              if (userClickedSite) {
                openInactiveSiteModal(
                  radarObj,
                  "maintenance",
                  "The feed returned a scan identical to an already-seen frame for " +
                    radarObj.id +
                    " (" +
                    ridgeProd +
                    "). The radar may be between volume scans or in maintenance/clear-air standby."
                );
              }
              return;
            }

            seenScanSignatures.add(fullSig);
            const now = new Date();
            const hh = String(now.getUTCHours()).padStart(2, "0");
            const mm = String(now.getUTCMinutes()).padStart(2, "0");
            const ss = String(now.getUTCSeconds()).padStart(2, "0");
            const labelName = radarObj.id + "_" + ridgeProd + "_" + hh + mm + ss + "Z";

            const newScanItem = {
              filename: labelName,
              signature: fullSig,
              objectUrl: URL.createObjectURL(blob),
              collectedAt: Date.now()
            };

            tenMinuteStagingQueue.push(newScanItem);

            if (deliverImmediately || savedScanFrames.length === 0) {
              flushTenMinuteBatchIntoSavedLoop();
            } else {
              renderPlayerAndElevations();
            }
          });
        })
        .catch(function (err) {
          renderPlayerAndElevations();
          if (userClickedSite) {
            openInactiveSiteModal(
              radarObj,
              "feed",
              "Could not retrieve a fresh scan image for " +
                radarObj.id +
                " (" +
                (err && err.message ? err.message : "feed error") +
                "). The radar site may be offline/under maintenance or not broadcasting this product right now."
            );
          }
        });
    }

    function renderPlayerAndElevations() {
      const radarObj = getActiveRadarObj();
      const fileEl = document.getElementById("scanFileName");
      const countEl = document.getElementById("scanFrameCount");
      const elevHeader = document.getElementById("elevHeaderTitle");
      const elevGrid = document.getElementById("elevGrid");
      const statusEl = document.getElementById("radarFeedStatus");

      const activeFrame = savedScanFrames[currentFrameIndex] || null;

      if (fileEl) {
        fileEl.textContent = activeFrame ? activeFrame.filename : "Awaiting new scan...";
      }

      if (countEl) {
        if (savedScanFrames.length > 0) {
          countEl.textContent = (currentFrameIndex + 1) + "/" + savedScanFrames.length;
        } else {
          countEl.textContent = "0/0";
        }
      }

      if (elevHeader) {
        elevHeader.textContent = radarObj.id + " elevations";
      }

      if (elevGrid) {
        elevGrid.innerHTML = "";
        ELEVATION_LEVELS.forEach(function (elev) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className =
            "elev-item" + (elev.angle === selectedElevation.angle ? " active" : "");

          const badgeCount = savedScanFrames.length > 0 ? savedScanFrames.length : 1;
          btn.innerHTML =
            "<span>" + elev.angle + "</span>" +
            '<span class="elev-badge">' + badgeCount + "</span>";

          btn.addEventListener("click", function () {
            selectedElevation = elev;
            renderPlayerAndElevations();
            pollForNewScan(true, false);
          });

          elevGrid.appendChild(btn);
        });
      }

      if (statusEl) {
        statusEl.textContent =
          "10m staging: " +
          tenMinuteStagingQueue.length +
          " • Last 10m batch: " +
          lastTenMinDeliverCount +
          " new";
      }
    }

    function stopLoopPlayback() {
      isPlaying = false;
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
      const playBtn = document.getElementById("btnPlayLoop");
      if (playBtn) {
        playBtn.classList.remove("playing");
        playBtn.innerHTML = "&#9654;";
      }
    }

    function startLoopPlayback() {
      if (savedScanFrames.length <= 1) {
        return;
      }
      isPlaying = true;
      const playBtn = document.getElementById("btnPlayLoop");
      if (playBtn) {
        playBtn.classList.add("playing");
        playBtn.innerHTML = "&#10074;&#10074;";
      }
      playTimer = setInterval(function () {
        if (savedScanFrames.length === 0) {
          return;
        }
        currentFrameIndex = (currentFrameIndex + 1) % savedScanFrames.length;
        renderPlayerAndElevations();
        displayCurrentSavedFrame();
      }, 900);
    }

    function refreshMapSiteNames() {
      if (!map) {
        return;
      }

      OK_PRIMARY_RADARS.forEach(function (radar) {
        const layer = radarNameLayers[radar.id];
        if (!layer) {
          return;
        }

        if (siteNamesVisible) {
          if (!map.hasLayer(layer)) {
            layer.addTo(map);
          }
          const el = layer.getElement();
          const textSpan = el ? el.querySelector(".map-site-text") : null;
          if (textSpan) {
            textSpan.classList.toggle("selected", selectedRadarId === radar.id);
          }
        } else if (map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });

      renderPlayerAndElevations();
    }

    function applyMapStyle(styleName) {
      if (!map || !darkMinimalLayer || !detailedOSMLayer) {
        return;
      }

      const darkBtn = document.getElementById("styleDarkMinimal");
      const osmBtn = document.getElementById("styleDetailedOSM");

      if (styleName === "detailed") {
        if (map.hasLayer(darkMinimalLayer)) {
          map.removeLayer(darkMinimalLayer);
        }
        if (!map.hasLayer(detailedOSMLayer)) {
          detailedOSMLayer.addTo(map);
        }
        if (osmBtn) {
          osmBtn.classList.add("active");
        }
        if (darkBtn) {
          darkBtn.classList.remove("active");
        }
      } else {
        if (map.hasLayer(detailedOSMLayer)) {
          map.removeLayer(detailedOSMLayer);
        }
        if (!map.hasLayer(darkMinimalLayer)) {
          darkMinimalLayer.addTo(map);
        }
        if (darkBtn) {
          darkBtn.classList.add("active");
        }
        if (osmBtn) {
          osmBtn.classList.remove("active");
        }
      }

      try {
        localStorage.setItem("t101_map_style", styleName);
      } catch (err) {
        // Ignore storage errors
      }
    }

    renderPlayerAndElevations();

    const btnPrevFrame = document.getElementById("btnPrevFrame");
    const btnNextFrame = document.getElementById("btnNextFrame");
    const btnPlayLoop = document.getElementById("btnPlayLoop");
    const btnRefreshScans = document.getElementById("btnRefreshScans");

    if (btnPrevFrame) {
      btnPrevFrame.addEventListener("click", function () {
        if (savedScanFrames.length === 0) {
          return;
        }
        stopLoopPlayback();
        currentFrameIndex = (currentFrameIndex - 1 + savedScanFrames.length) % savedScanFrames.length;
        renderPlayerAndElevations();
        displayCurrentSavedFrame();
      });
    }

    if (btnNextFrame) {
      btnNextFrame.addEventListener("click", function () {
        if (savedScanFrames.length === 0) {
          return;
        }
        stopLoopPlayback();
        currentFrameIndex = (currentFrameIndex + 1) % savedScanFrames.length;
        renderPlayerAndElevations();
        displayCurrentSavedFrame();
      });
    }

    if (btnPlayLoop) {
      btnPlayLoop.addEventListener("click", function () {
        if (isPlaying) {
          stopLoopPlayback();
        } else {
          startLoopPlayback();
        }
      });
    }

    if (btnRefreshScans) {
      btnRefreshScans.addEventListener("click", function () {
        stopLoopPlayback();
        flushTenMinuteBatchIntoSavedLoop();
        pollForNewScan(true, false);
      });
    }

    const btnSiteNames = document.getElementById("btnSiteNames");
    if (btnSiteNames) {
      btnSiteNames.addEventListener("click", function () {
        siteNamesVisible = !siteNamesVisible;
        btnSiteNames.classList.toggle("active", siteNamesVisible);
        refreshMapSiteNames();
      });
    }

    const btnWeatherVersion = document.getElementById("btnWeatherVersion");
    const btnAllVersion = document.getElementById("btnAllVersion");
    const btnWarnings = document.getElementById("btnWarnings");
    const btnConfirmed = document.getElementById("btnConfirmed");

    if (btnWeatherVersion && btnAllVersion) {
      btnWeatherVersion.addEventListener("click", function () {
        mode = "weather";
        btnWeatherVersion.classList.add("active");
        btnAllVersion.classList.remove("active");
        updateWarningsDisplay();
      });

      btnAllVersion.addEventListener("click", function () {
        mode = "all";
        btnAllVersion.classList.add("active");
        btnWeatherVersion.classList.remove("active");
        updateWarningsDisplay();
      });
    }

    if (btnWarnings) {
      btnWarnings.addEventListener("click", function () {
        warningsEnabled = !warningsEnabled;
        btnWarnings.classList.toggle("active", warningsEnabled);
        updateWarningsDisplay();
      });
    }

    if (btnConfirmed) {
      btnConfirmed.addEventListener("click", function () {
        confirmedOnly = !confirmedOnly;
        btnConfirmed.classList.toggle("active", confirmedOnly);
        updateWarningsDisplay();
      });
    }

    ["btnReports", "btnOutlook", "btnMD"].forEach(function (id) {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener("click", function () {
          btn.classList.toggle("active");
        });
      }
    });

    const prodButtons = document.querySelectorAll(".prod-btn");
    prodButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        prodButtons.forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        selectedProductKey = btn.getAttribute("data-prod") || "ref";
        pollForNewScan(true, false);
      });
    });

    if (typeof L !== "undefined") {
      map = L.map("map").setView([35.3334, -97.2779], 8);

      const cleanKey = CARTO_API_KEY.trim();
      const cartoUrl = cleanKey
        ? "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=" +
          encodeURIComponent(cleanKey)
        : "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png";

      darkMinimalLayer = L.tileLayer(cartoUrl, {
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
        maxZoom: 20
      });

      detailedOSMLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      });

      let savedStyle = "dark";
      try {
        savedStyle = localStorage.getItem("t101_map_style") || "dark";
      } catch (err) {
        savedStyle = "dark";
      }
      applyMapStyle(savedStyle);

      // Initial scan fetch & continuous background polling + 10-minute batch delivery
      pollForNewScan(true, false);
      setInterval(function () {
        pollForNewScan(false, false);
      }, POLL_INTERVAL_MS);

      setInterval(function () {
        flushTenMinuteBatchIntoSavedLoop();
      }, BATCH_WINDOW_MS);

      OK_PRIMARY_RADARS.forEach(function (radar) {
        const labelIcon = L.divIcon({
          className: "",
          html: '<span class="map-site-text">' + radar.id + "</span>",
          iconSize: [44, 18],
          iconAnchor: [22, 9]
        });

        const labelMarker = L.marker([radar.lat, radar.lon], {
          icon: labelIcon,
          interactive: true
        });

        labelMarker.on("click", function () {
          stopLoopPlayback();
          closeInactiveSiteModal();
          selectedRadarId = radar.id;
          tenMinuteStagingQueue = [];
          refreshMapSiteNames();
          pollForNewScan(true, true);
        });

        radarNameLayers[radar.id] = labelMarker;
      });

      refreshMapSiteNames();

      const styleDarkBtn = document.getElementById("styleDarkMinimal");
      const styleOSMBtn = document.getElementById("styleDetailedOSM");

      if (styleDarkBtn) {
        styleDarkBtn.addEventListener("click", function () {
          applyMapStyle("dark");
        });
      }

      if (styleOSMBtn) {
        styleOSMBtn.addEventListener("click", function () {
          applyMapStyle("detailed");
        });
      }

      sampleWarnings = [
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.390, -98.02, 35.425, -97.96, "#ffea00", "Severe Thunderstorm Warning (Base)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.350, -98.02, 35.385, -97.96, "#d4ac0d", "Severe Thunderstorm Warning (Considerable)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -98.02, 35.345, -97.96, "#8a6d00", "Severe Thunderstorm Warning (Destructive)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -97.95, 35.425, -97.89, "#e60000", "Tornado Warning")
        },
        {
          type: "weather",
          confirmed: true,
          layer: makeBox(35.310, -97.88, 35.425, -97.82, "#800000", "Tornado Warning (PDS)")
        },
        {
          type: "weather",
          confirmed: true,
          layer: makeBox(35.310, -97.81, 35.425, -97.75, "#d946ef", "Tornado Emergency")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -97.74, 35.425, -97.68, "#16a34a", "Flood Warning")
        },
        {
          type: "other",
          confirmed: false,
          layer: makeBox(35.310, -97.67, 35.425, -97.61, "#ff4da6", "Snow Warning")
        },
        {
          type: "other",
          confirmed: false,
          layer: makeBox(35.310, -97.60, 35.425, -97.54, "#a855f7", "Wind / Gale Warning")
        }
      ];

      updateWarningsDisplay();

      const searchForm = document.getElementById("searchForm");
      if (searchForm) {
        searchForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const input = document.getElementById("searchInput");
          const query = input ? input.value.trim() : "";
          if (!query) {
            return;
          }

          fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(query))
            .then(function (res) {
              return res.json();
            })
            .then(function (results) {
              if (results && results.length > 0 && map) {
                map.setView([parseFloat(results[0].lat), parseFloat(results[0].lon)], 10);
              }
            })
            .catch(function () {
              // Ignore network errors
            });
        });
      }
    }
  </script>
</body>
</html>
