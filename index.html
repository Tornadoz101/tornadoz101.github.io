<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tornadoz101's Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    :root {
      --panel-bg: #1e293b;
      --panel-text: #ffffff;
      --muted-text: #cbd5e1;
      --border-color: #000000;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --top-bar-bg: linear-gradient(to right, #1e293b 75%, #334155 100%);
      --input-bg: #0f172a;
      --input-text: #ffffff;
      --input-border: #64748b;
      --settings-icon: #cbd5e1;
      --settings-hover: #ffffff;
      --popup-bg: #1e293b;
      --popup-text: #ffffff;
      --disclaimer-text: #ef4444;
      --accent-blue: #38bdf8;
      --elev-active-bg: rgba(56, 189, 248, 0.18);
    }

    body.light-mode {
      --panel-bg: #ffffff;
      --panel-text: #111111;
      --muted-text: #6b7280;
      --border-color: #000000;
      --btn-bg: #ffffff;
      --btn-text: #111111;
      --top-bar-bg: linear-gradient(to right, #ffffff 75%, #e5e7eb 100%);
      --input-bg: #ffffff;
      --input-text: #111111;
      --input-border: #9ca3af;
      --settings-icon: #9ca3af;
      --settings-hover: #374151;
      --popup-bg: #ffffff;
      --popup-text: #111111;
      --disclaimer-text: #dc2626;
      --accent-blue: #0284c7;
      --elev-active-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      font-family: sans-serif;
    }

    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    /* LEFT COLUMN */
    .left-column {
      width: 235px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      border-right: 3px solid var(--border-color);
      flex-shrink: 0;
    }

    .brand-box {
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--border-color);
      padding: 4px 8px;
      text-align: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--panel-text);
    }

    .brand-version {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-text);
      margin-top: 2px;
      line-height: 1;
    }

    .brand-disclaimer {
      font-size: 8px;
      font-weight: 800;
      color: var(--disclaimer-text);
      margin-top: 4px;
      line-height: 1.15;
      letter-spacing: 0.2px;
    }

    .left-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 8px;
      min-height: 0;
      overflow-y: auto;
    }

    .empty-slots {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* FILE / FRAME PLAYER CARD */
    .player-card {
      border-bottom: 1px solid var(--input-border);
      padding-bottom: 8px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-text);
      padding-bottom: 3px;
      border-bottom: 1px solid var(--input-border);
      margin-bottom: 5px;
    }

    .player-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--panel-text);
      margin-bottom: 8px;
    }

    .player-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 165px;
    }

    .player-frame-count {
      color: var(--muted-text);
      flex-shrink: 0;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .step-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
    }

    .step-btn:hover {
      opacity: 0.8;
    }

    .play-circle-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent-blue);
      background: transparent;
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .play-circle-btn.playing {
      background-color: var(--accent-blue);
      color: #0f172a;
    }

    /* ELEVATIONS GRID */
    .elev-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .elev-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--panel-text);
    }

    .load-loop-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .load-loop-btn:hover {
      text-decoration: underline;
    }

    .elev-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px 4px;
    }

    .elev-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent-blue);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .elev-item.active {
      background-color: var(--elev-active-bg);
    }

    .elev-badge {
      position: absolute;
      top: 1px;
      right: 4px;
      font-size: 8.5px;
      font-weight: 700;
      color: var(--muted-text);
      border: 1px solid var(--input-border);
      background-color: var(--panel-bg);
      border-radius: 3px;
      padding: 0 3px;
      line-height: 1.2;
    }

    .radar-status-note {
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted-text);
      line-height: 1.25;
    }

    .product-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .prod-btn {
      width: 100%;
      padding: 6px 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 800;
      border-radius: 0;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .prod-reflectivity {
      border-color: #1d4ed8;
    }

    .prod-reflectivity.active {
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .prod-velocity {
      border-color: #22c55e;
    }

    .prod-velocity.active {
      background-color: #22c55e;
      color: #052e16;
    }

    .prod-spectrum {
      border-color: #6b7280;
    }

    .prod-spectrum.active {
      background-color: #6b7280;
      color: #ffffff;
    }

    .prod-cc {
      border-color: #f43f5e;
    }

    .prod-cc.active {
      background-color: #f43f5e;
      color: #ffffff;
    }

    /* RIGHT COLUMN */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .top-bar {
      min-height: 76px;
      background: var(--top-bar-bg);
      color: var(--panel-text);
      border-bottom: 3px solid var(--border-color);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(96px, auto));
      grid-template-rows: repeat(2, auto);
      gap: 4px 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      padding: 3px 10px;
      border-radius: 999px;
      border: 2px solid #7cc4fa;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .top-center-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 140px;
    }

    .utc-clock {
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--panel-text);
      letter-spacing: 0.4px;
      line-height: 1;
    }

    .search-form {
      display: flex;
      width: 100%;
      max-width: 220px;
      height: 22px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      border: 2px solid var(--input-border);
      border-right: none;
      border-radius: 999px 0 0 999px;
      outline: none;
      background-color: var(--input-bg);
      color: var(--input-text);
    }

    .search-input:focus {
      border-color: #1d4ed8;
    }

    .search-go {
      padding: 0 9px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid #1d4ed8;
      border-radius: 0 999px 999px 0;
      background-color: #1d4ed8;
      color: #ffffff;
      cursor: pointer;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-right: 78px;
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--settings-icon);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .settings-btn:hover,
    .settings-btn.active {
      color: var(--settings-hover);
    }

    .map-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      background-color: #18181b;
    }

    .level2-canvas-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 350;
    }

    .map-site-text {
      display: inline-block;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .map-site-text.selected {
      color: #3b82f6;
    }

    .popup-panel {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: 245px;
      min-height: 150px;
      background-color: var(--popup-bg);
      color: var(--popup-text);
      border: 3px solid var(--border-color);
      z-index: 1000;
      padding: 12px;
      font-size: 12px;
    }

    .popup-panel.open {
      display: block;
    }

    .settings-title {
      font-size: 13px;
      font-weight: 800;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .settings-title:first-child {
      margin-top: 0;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-row {
      display: flex;
      gap: 6px;
    }

    .opt-btn {
      flex: 1;
      width: 100%;
      padding: 7px 9px;
      border: 2px solid var(--input-border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .option-row .opt-btn {
      text-align: center;
    }

    .opt-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="left-column">
      <div class="brand-box">
        <div class="brand-title">Tornadoz101’s Radar</div>
        <div class="brand-version">Version 1.1</div>
        <div class="brand-disclaimer">
          <strong>SCANS ARE THE LATEST AVAILABLE, MAY NOT BE DIRECTLY UP TO DATE</strong>
        </div>
      </div>

      <div class="left-body">
        <div class="empty-slots">
          <div class="player-card">
            <div class="player-header">
              <span>File</span>
              <span>Frame</span>
            </div>
            <div class="player-info-row">
              <span class="player-file-name" id="scanFileName">Loading...</span>
              <span class="player-frame-count" id="scanFrameCount">0/0</span>
            </div>
            <div class="player-controls">
              <button type="button" class="step-btn" id="btnPrevFrame" title="Previous Scan">&lt;</button>
              <button type="button" class="play-circle-btn" id="btnPlayLoop" title="Play / Pause Loop">&#9654;</button>
              <button type="button" class="step-btn" id="btnNextFrame" title="Next Scan">&gt;</button>
            </div>
          </div>

          <div>
            <div class="elev-section-header">
              <span class="elev-title" id="elevHeaderTitle">KTLX elevations</span>
              <button type="button" class="load-loop-btn" id="btnRefreshScans">Load Loop</button>
            </div>
            <div class="elev-grid" id="elevGrid"></div>
            <div class="radar-status-note" id="radarFeedStatus">
              KTLX • Tilt 0.5° • L2 Canvas
            </div>
          </div>
        </div>

        <div class="product-buttons">
          <button type="button" class="prod-btn prod-reflectivity active" data-prod="ref">
            Reflectivity
          </button>
          <button type="button" class="prod-btn prod-velocity" data-prod="vel">
            Velocity
          </button>
          <button type="button" class="prod-btn prod-spectrum" data-prod="sw">
            Spectrum Width
          </button>
          <button type="button" class="prod-btn prod-cc" data-prod="cc">
            CC
          </button>
        </div>
      </div>
    </aside>

    <div class="right-column">
      <header class="top-bar">
        <div class="pill-grid">
          <button type="button" class="pill-btn active" id="btnSiteNames">Site Names</button>
          <button type="button" class="pill-btn" id="btnAllVersion">All Version</button>
          <button type="button" class="pill-btn" id="btnReports">Reports</button>
          <button type="button" class="pill-btn" id="btnOutlook">Outlook</button>

          <button type="button" class="pill-btn active" id="btnWeatherVersion">Weather Version</button>
          <button type="button" class="pill-btn active" id="btnWarnings">Warnings</button>
          <button type="button" class="pill-btn" id="btnConfirmed">Confirmed</button>
          <button type="button" class="pill-btn" id="btnMD">MD</button>
        </div>

        <div class="top-center-stack">
          <div class="utc-clock" id="utcClock">--:--:-- UTC</div>
          <form class="search-form" id="searchForm">
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="Search city or state..."
            />
            <button type="submit" class="search-go">Go</button>
          </form>
        </div>

        <div class="top-right-group">
          <button type="button" class="settings-btn" id="btnSettings">Settings ⚙️</button>
        </div>
      </header>

      <div class="map-wrap">
        <div id="map"></div>
        <canvas id="level2Canvas" class="level2-canvas-layer"></canvas>

        <div class="popup-panel" id="settingsModal">
          <div class="settings-title">Theme</div>
          <div class="option-row">
            <button type="button" class="opt-btn active" id="themeDark">Dark</button>
            <button type="button" class="opt-btn" id="themeLight">Light</button>
          </div>

          <div class="settings-title">Map Style</div>
          <div class="option-group">
            <button type="button" class="opt-btn active" id="styleDarkMinimal">
              Dark Minimal (Default)
            </button>
            <button type="button" class="opt-btn" id="styleDetailedOSM">
              Detailed Street (OSM)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CARTO_API_KEY = "cb1_5fjg_1_351c53d02c76f010f2762ee8";
    const MAX_LOOP_FRAMES = 10;
    const S3_BUCKET_URL = "https://unidata-nexrad-level2.s3.amazonaws.com";

    const OK_PRIMARY_RADARS = [
      { id: "KTLX", sector: "TLX", name: "Oklahoma City / Norman, OK", lat: 35.3334, lon: -97.2779 },
      { id: "KVNX", sector: "VNX", name: "Vance AFB / Enid, OK", lat: 36.740617, lon: -98.127717 },
      { id: "KINX", sector: "INX", name: "Tulsa / Inola, OK", lat: 36.1750, lon: -95.5640 },
      { id: "KFDR", sector: "FDR", name: "Frederick, OK", lat: 34.3622, lon: -98.9766 }
    ];

    const ELEVATION_LEVELS = [
      { angle: "0.5°", deg: 0.5, code: "0" },
      { angle: "0.9°", deg: 0.9, code: "1" },
      { angle: "1.3°", deg: 1.3, code: "2" },
      { angle: "1.8°", deg: 1.8, code: "3" },
      { angle: "2.4°", deg: 2.4, code: "0" },
      { angle: "3.1°", deg: 3.1, code: "0" },
      { angle: "4.0°", deg: 4.0, code: "0" },
      { angle: "5.1°", deg: 5.1, code: "0" },
      { angle: "6.4°", deg: 6.4, code: "0" }
    ];

    const PRODUCT_PREFIX = {
      ref: "N",
      vel: "N",
      sw: "N",
      cc: "N"
    };

    const PRODUCT_SUFFIX = {
      ref: "Q",
      vel: "U",
      sw: "S",
      cc: "C"
    };

    let selectedRadarId = "KTLX";
    let selectedElevation = ELEVATION_LEVELS[0];
    let selectedProductKey = "ref";
    let siteNamesVisible = true;
    const radarNameLayers = {};
    let fallbackWmsLayer = null;

    let scanFrames = [];
    let currentFrameIndex = 0;
    let isPlaying = false;
    let playTimer = null;

    // Cache of parsed Level II sweeps keyed by S3 key: { sweeps: Map<elevNumber, { elevAngle, radials }> }
    const decodedVolumeCache = new Map();
    let currentDecodedVolume = null;
    let fetchToken = 0;

    function getActiveRadarObj() {
      return OK_PRIMARY_RADARS.find(function (r) {
        return r.id === selectedRadarId;
      }) || OK_PRIMARY_RADARS[0];
    }

    function getRidgeProductCode() {
      const prefix = PRODUCT_PREFIX[selectedProductKey] || "N";
      const suffix = PRODUCT_SUFFIX[selectedProductKey] || "Q";
      const tiltCode = selectedElevation ? selectedElevation.code : "0";
      return prefix + tiltCode + suffix;
    }

    function applyThemeMode(themeName) {
      const isLight = themeName === "light";
      document.body.classList.toggle("light-mode", isLight);

      const darkBtn = document.getElementById("themeDark");
      const lightBtn = document.getElementById("themeLight");

      if (darkBtn) {
        darkBtn.classList.toggle("active", !isLight);
      }

      if (lightBtn) {
        lightBtn.classList.toggle("active", isLight);
      }

      try {
        localStorage.setItem("t101_theme_mode", isLight ? "light" : "dark");
      } catch (err) {
        // Ignore storage errors
      }
    }

    let savedTheme = "dark";
    try {
      savedTheme = localStorage.getItem("t101_theme_mode") || "dark";
    } catch (err) {
      savedTheme = "dark";
    }
    applyThemeMode(savedTheme);

    const themeDarkBtn = document.getElementById("themeDark");
    const themeLightBtn = document.getElementById("themeLight");

    if (themeDarkBtn) {
      themeDarkBtn.addEventListener("click", function () {
        applyThemeMode("dark");
      });
    }

    if (themeLightBtn) {
      themeLightBtn.addEventListener("click", function () {
        applyThemeMode("light");
      });
    }

    function updateUTCClock() {
      const clockEl = document.getElementById("utcClock");
      if (!clockEl) {
        return;
      }

      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, "0");
      const mm = String(now.getUTCMinutes()).padStart(2, "0");
      const ss = String(now.getUTCSeconds()).padStart(2, "0");
      clockEl.textContent = hh + ":" + mm + ":" + ss + " UTC";
    }

    updateUTCClock();
    setInterval(updateUTCClock, 1000);

    const btnSettings = document.getElementById("btnSettings");
    const settingsModal = document.getElementById("settingsModal");

    if (btnSettings && settingsModal) {
      btnSettings.addEventListener("click", function () {
        btnSettings.classList.toggle("active");
        settingsModal.classList.toggle("open");
      });
    }

    let mode = "weather";
    let warningsEnabled = true;
    let confirmedOnly = false;
    let map = null;
    let sampleWarnings = [];
    let darkMinimalLayer = null;
    let detailedOSMLayer = null;

    function makeBox(s, w, n, e, color, label) {
      return L.rectangle(
        [
          [s, w],
          [n, e]
        ],
        {
          color: color,
          fillColor: color,
          fillOpacity: 0.5,
          weight: 2
        }
      ).bindPopup(label);
    }

    function updateWarningsDisplay() {
      if (!map) {
        return;
      }

      sampleWarnings.forEach(function (item) {
        const modeMatch = mode === "all" || item.type === "weather";
        const confirmedMatch = !confirmedOnly || item.confirmed;
        const shouldShow = warningsEnabled && modeMatch && confirmedMatch;

        if (shouldShow && !map.hasLayer(item.layer)) {
          item.layer.addTo(map);
        } else if (!shouldShow && map.hasLayer(item.layer)) {
          map.removeLayer(item.layer);
        }
      });
    }

    /* =========================================================================
       PURE-JS BZIP2 DECOMPRESSOR (BZh block stream decoder for NEXRAD L2)
       ========================================================================= */
    function bzip2DecompressStream(bytes) {
      const outChunks = [];
      let pos = 0;

      while (pos + 4 <= bytes.length) {
        // Look for "BZh" signature
        if (bytes[pos] === 0x42 && bytes[pos + 1] === 0x5a && bytes[pos + 2] === 0x68) {
          const blockSize100k = bytes[pos + 3] - 0x30;
          if (blockSize100k < 1 || blockSize100k > 9) {
            break;
          }
          const decoded = decodeSingleBzip2Block(bytes, pos + 4, blockSize100k);
          if (!decoded || !decoded.data) {
            break;
          }
          outChunks.push(decoded.data);
          pos = decoded.nextBytePos;
        } else {
          pos++;
        }
      }

      let totalLen = 0;
      for (let i = 0; i < outChunks.length; i++) {
        totalLen += outChunks[i].length;
      }
      const combined = new Uint8Array(totalLen);
      let offset = 0;
      for (let i = 0; i < outChunks.length; i++) {
        combined.set(outChunks[i], offset);
        offset += outChunks[i].length;
      }
      return combined;
    }

    // Standard bzip2 block decoder supporting BWT + MTF + RLE1 + Huffman
    function decodeSingleBzip2Block(data, startByteOffset, blockSize100k) {
      let bitBuf = 0;
      let bitCount = 0;
      let byteIdx = startByteOffset;

      function readBits(n) {
        while (bitCount < n) {
          if (byteIdx >= data.length) {
            throw new Error("Unexpected EOF in bzip2 stream");
          }
          bitBuf = (bitBuf << 8) | data[byteIdx++];
          bitCount += 8;
        }
        bitCount -= n;
        const val = (bitBuf >>> bitCount) & ((1 << n) - 1);
        return val >>> 0;
      }

      function readBit() {
        return readBits(1);
      }

      try {
        const blockType = readBits(48);
        // Check end-of-stream magic (0x177245385090) vs block magic (0x314159265359)
        if (blockType === 0x177245385090) {
          return { data: new Uint8Array(0), nextBytePos: byteIdx };
        }
        if (blockType !== 0x314159265359) {
          return null;
        }

        // Skip 32-bit block CRC
        readBits(32);

        const randBit = readBit();
        const origPtr = readBits(24);

        // Build 256-entry symbol map from 16x16 bitmask
        const inUse16 = readBits(16);
        const symToByte = new Uint8Array(256);
        let nInUse = 0;
        for (let i = 0; i < 16; i++) {
          if (inUse16 & (1 << (15 - i))) {
            const mask16 = readBits(16);
            for (let j = 0; j < 16; j++) {
              if (mask16 & (1 << (15 - j))) {
                symToByte[nInUse++] = i * 16 + j;
              }
            }
          }
        }

        const alphaSize = nInUse + 2;
        const nGroups = readBits(3);
        const nSelectors = readBits(15);
        if (nGroups < 2 || nGroups > 6 || nSelectors < 1 || nSelectors > 18002) {
          return null;
        }

        // Read selectors (unary 0s followed by 1)
        const selectorMtf = new Uint8Array(nSelectors);
        for (let i = 0; i < nSelectors; i++) {
          let j = 0;
          while (readBit() === 1) {
            j++;
            if (j > nGroups) {
              return null;
            }
          }
          selectorMtf[i] = j;
        }

        // Undo MTF on selectors
        const posArr = new Uint8Array(nGroups);
        for (let i = 0; i < nGroups; i++) {
          posArr[i] = i;
        }
        const selectors = new Uint8Array(nSelectors);
        for (let i = 0; i < nSelectors; i++) {
          let v = selectorMtf[i];
          const tmp = posArr[v];
          while (v > 0) {
            posArr[v] = posArr[v - 1];
            v--;
          }
          posArr[0] = tmp;
          selectors[i] = tmp;
        }

        // Read Huffman code lengths per group
        const lens = [];
        for (let t = 0; t < nGroups; t++) {
          let curr = readBits(5);
          const groupLens = new Uint8Array(alphaSize);
          for (let i = 0; i < alphaSize; i++) {
            while (true) {
              if (curr < 1 || curr > 20) {
                return null;
              }
              if (readBit() === 0) {
                break;
              }
              if (readBit() === 0) {
                curr++;
              } else {
                curr--;
              }
            }
            groupLens[i] = curr;
          }
          lens.push(groupLens);
        }

        // Build fast lookup tables per Huffman table
        const tables = lens.map(function (groupLens) {
          return buildHuffmanLookup(groupLens, alphaSize);
        });

        const maxBlockLen = blockSize100k * 100000;
        const bwtBlock = new Uint8Array(maxBlockLen);
        let nBlock = 0;
        let groupNo = 0;
        let groupPos = 50;
        let currTable = tables[selectors[0]];

        const EOB = nInUse + 1;

        while (true) {
          if (groupPos === 0) {
            groupNo++;
            if (groupNo >= nSelectors) {
              return null;
            }
            groupPos = 50;
            currTable = tables[selectors[groupNo]];
          }
          groupPos--;

          const sym = decodeHuffmanSymbol(currTable, readBit, readBits);
          if (sym === EOB) {
            break;
          }

          if (sym === 0 || sym === 1) {
            // RLE0 / RLE1 run length decoding
            let run = 0;
            let shift = 0;
            let s = sym;
            while (s === 0 || s === 1) {
              run += (s + 1) << shift;
              shift++;
              if (groupPos === 0) {
                groupNo++;
                if (groupNo >= nSelectors) {
                  return null;
                }
                groupPos = 50;
                currTable = tables[selectors[groupNo]];
              }
              groupPos--;
              s = decodeHuffmanSymbol(currTable, readBit, readBits);
            }

            const ch = symToByte[0];
            for (let r = 0; r < run; r++) {
              if (nBlock >= maxBlockLen) {
                return null;
              }
              bwtBlock[nBlock++] = ch;
            }

            // Process the non-run symbol `s` that terminated the run
            if (s === EOB) {
              break;
            }
            const mtfIdx = s - 1;
            const byteVal = symToByte[mtfIdx];
            for (let k = mtfIdx; k > 0; k--) {
              symToByte[k] = symToByte[k - 1];
            }
            symToByte[0] = byteVal;
            if (nBlock >= maxBlockLen) {
              return null;
            }
            bwtBlock[nBlock++] = byteVal;
          } else {
            const mtfIdx = sym - 1;
            const byteVal = symToByte[mtfIdx];
            for (let k = mtfIdx; k > 0; k--) {
              symToByte[k] = symToByte[k - 1];
            }
            symToByte[0] = byteVal;
            if (nBlock >= maxBlockLen) {
              return null;
            }
            bwtBlock[nBlock++] = byteVal;
          }
        }

        if (origPtr < 0 || origPtr >= nBlock) {
          return null;
        }

        // Inverse BWT
        const cftab = new Int32Array(257);
        for (let i = 0; i < nBlock; i++) {
          cftab[bwtBlock[i] + 1]++;
        }
        for (let i = 1; i <= 256; i++) {
          cftab[i] += cftab[i - 1];
        }

        const tt = new Int32Array(nBlock);
        const cftabCopy = new Int32Array(cftab);
        for (let i = 0; i < nBlock; i++) {
          const uc = bwtBlock[i];
          tt[cftabCopy[uc]++] = i;
        }

        // Undo BWT + RLE1 (4 identical bytes followed by repeat count)
        const unbwt = new Uint8Array(nBlock);
        let tPos = tt[origPtr];
        for (let i = nBlock - 1; i >= 0; i--) {
          unbwt[i] = bwtBlock[tPos];
          tPos = tt[tPos];
        }

        const rleOut = [];
        let idx = 0;
        while (idx < nBlock) {
          const b0 = unbwt[idx];
          if (
            idx + 3 < nBlock &&
            unbwt[idx + 1] === b0 &&
            unbwt[idx + 2] === b0 &&
            unbwt[idx + 3] === b0
          ) {
            const repeatCount = idx + 4 < nBlock ? unbwt[idx + 4] : 0;
            for (let k = 0; k < 4 + repeatCount; k++) {
              rleOut.push(b0);
            }
            idx += 5;
          } else {
            rleOut.push(b0);
            idx++;
          }
        }

        // Rewind byteIdx if unread bits exist in bitBuf
        const wholeUnreadBytes = Math.floor(bitCount / 8);
        const nextBytePos = byteIdx - wholeUnreadBytes;

        return {
          data: new Uint8Array(rleOut),
          nextBytePos: nextBytePos
        };
      } catch (err) {
        return null;
      }
    }

    function buildHuffmanLookup(lengths, alphaSize) {
      let minLen = 25;
      let maxLen = 0;
      for (let i = 0; i < alphaSize; i++) {
        const l = lengths[i];
        if (l > 0) {
          if (l < minLen) minLen = l;
          if (l > maxLen) maxLen = l;
        }
      }

      const count = new Int32Array(maxLen + 2);
      for (let i = 0; i < alphaSize; i++) {
        if (lengths[i] > 0) {
          count[lengths[i]]++;
        }
      }

      const base = new Int32Array(maxLen + 2);
      const limit = new Int32Array(maxLen + 2);
      let code = 0;
      for (let i = minLen; i <= maxLen; i++) {
        base[i] = code - count[i];
        code += count[i];
        limit[i] = code - 1;
        code <<= 1;
      }

      const perm = new Int32Array(alphaSize);
      let pIdx = 0;
      for (let len = minLen; len <= maxLen; len++) {
        for (let sym = 0; sym < alphaSize; sym++) {
          if (lengths[sym] === len) {
            perm[pIdx++] = sym;
          }
        }
      }

      return {
        minLen: minLen,
        maxLen: maxLen,
        base: base,
        limit: limit,
        perm: perm
      };
    }

    function decodeHuffmanSymbol(tbl, readBit, readBits) {
      let len = tbl.minLen;
      let code = readBits(len);
      while (len <= tbl.maxLen) {
        if (code <= tbl.limit[len]) {
          const idx = tbl.base[len] + code;
          return tbl.perm[idx];
        }
        len++;
        code = (code << 1) | readBit();
      }
      throw new Error("Invalid Huffman code");
    }

    /* =========================================================================
       NEXRAD LEVEL II MESSAGE TYPE 31 PARSER (Sweeps, Radials, REF/VEL/SW/CC)
       ========================================================================= */
    function parseNexradLevel2Buffer(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      if (bytes.length < 36) {
        return null;
      }

      // 24-byte Archive2 volume header + optional 12-byte CTM header before compressed messages
      let payloadStart = 24;
      const decompressed = bzip2DecompressStream(bytes.subarray(payloadStart));
      if (!decompressed || decompressed.length < 32) {
        return null;
      }

      const view = new DataView(
        decompressed.buffer,
        decompressed.byteOffset,
        decompressed.byteLength
      );

      const sweepsMap = new Map();
      let offset = 0;

      while (offset + 28 <= decompressed.length) {
        // NEXRAD Level II message header:
        // bytes 12..13: message size in halfwords (16-bit words)
        // byte 15: message type
        const msgSizeWords = view.getUint16(offset + 12, false);
        const msgType = decompressed[offset + 15];
        const msgByteLen = msgSizeWords * 2;

        if (msgByteLen < 24 || offset + msgByteLen > decompressed.length) {
          break;
        }

        if (msgType === 31 && offset + 64 <= decompressed.length) {
          // Digital Radar Data (Message Type 31)
          // Header starts at offset + 16:
          // +0..3 (4B): radar ID
          // +4..7 (4B): collection ms
          // +8..9 (2B): Julian date
          // +10..11 (2B): azimuth angle (IEEE float32)
          const azimuth = view.getFloat32(offset + 26, false);
          // +16..17 (2B): azimuth resolution spacing (1 = 0.5 deg, 2 = 1.0 deg)
          const azSpacingCode = view.getUint16(offset + 32, false);
          const azWidthDeg = azSpacingCode === 1 ? 0.5 : 1.0;
          // +19 (1B): elevation number
          const elevNum = decompressed[offset + 35];
          // +24..27 (4B): elevation angle (IEEE float32)
          const elevAngle = view.getFloat32(offset + 40, false);
          // +30..31 (2B): data block count
          const blockCount = view.getUint16(offset + 46, false);

          const moments = {};
          const ptrListOffset = offset + 48;

          for (let b = 0; b < blockCount; b++) {
            if (ptrListOffset + b * 4 + 4 > offset + msgByteLen) {
              break;
            }
            const blockRelOffset = view.getUint32(ptrListOffset + b * 4, false);
            const blockAbs = offset + 16 + blockRelOffset;

            if (blockAbs + 28 > decompressed.length) {
              continue;
            }

            const blockTypeChar = String.fromCharCode(decompressed[blockAbs]);
            const dataName = String.fromCharCode(
              decompressed[blockAbs + 1],
              decompressed[blockAbs + 2],
              decompressed[blockAbs + 3]
            ).trim();

            if (blockTypeChar === "D") {
              const gateCount = view.getUint16(blockAbs + 8, false);
              const firstGateKm = view.getUint16(blockAbs + 10, false) / 1000.0;
              const gateIntervalKm = view.getUint16(blockAbs + 12, false) / 1000.0;
              const wordSizeBits = decompressed[blockAbs + 19];
              const scale = view.getFloat32(blockAbs + 20, false);
              const offsetVal = view.getFloat32(blockAbs + 24, false);

              const values = new Float32Array(gateCount);
              const payloadStartGate = blockAbs + 28;

              if (wordSizeBits === 8) {
                for (let g = 0; g < gateCount && payloadStartGate + g < decompressed.length; g++) {
                  const raw = decompressed[payloadStartGate + g];
                  if (raw <= 1) {
                    values[g] = NaN;
                  } else {
                    values[g] = (raw - offsetVal) / scale;
                  }
                }
              } else if (wordSizeBits === 16) {
                for (let g = 0; g < gateCount && payloadStartGate + g * 2 + 1 < decompressed.length; g++) {
                  const raw16 = view.getUint16(payloadStartGate + g * 2, false);
                  if (raw16 <= 1) {
                    values[g] = NaN;
                  } else {
                    values[g] = (raw16 - offsetVal) / scale;
                  }
                }
              }

              moments[dataName] = {
                gateCount: gateCount,
                firstGateKm: firstGateKm,
                gateIntervalKm: gateIntervalKm,
                values: values
              };
            }
          }

          if (!sweepsMap.has(elevNum)) {
            sweepsMap.set(elevNum, {
              elevNum: elevNum,
              elevAngle: isFinite(elevAngle) ? elevAngle : 0.5,
              radials: []
            });
          }

          sweepsMap.get(elevNum).radials.push({
            azimuth: azimuth,
            azWidthDeg: azWidthDeg,
            moments: moments
          });
        }

        offset += msgByteLen;
      }

      if (sweepsMap.size === 0) {
        return null;
      }

      return { sweeps: sweepsMap };
    }

    function pickSweepForSelectedElevation(volume) {
      if (!volume || !volume.sweeps || volume.sweeps.size === 0) {
        return null;
      }

      const targetDeg = selectedElevation ? selectedElevation.deg : 0.5;
      let bestSweep = null;
      let bestDiff = Infinity;

      volume.sweeps.forEach(function (sweep) {
        const diff = Math.abs(sweep.elevAngle - targetDeg);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestSweep = sweep;
        }
      });

      return bestSweep;
    }

    /* =========================================================================
       COLOR TABLES & CANVAS POLAR SWEEP RENDERER
       ========================================================================= */
    function getMomentColor(prodKey, val) {
      if (!isFinite(val)) {
        return null;
      }

      if (prodKey === "ref") {
        if (val < 5) return null;
        if (val < 15) return "rgba(0, 236, 236, 0.65)";
        if (val < 25) return "rgba(1, 160, 246, 0.72)";
        if (val < 35) return "rgba(0, 255, 0, 0.75)";
        if (val < 45) return "rgba(255, 255, 0, 0.80)";
        if (val < 55) return "rgba(255, 144, 0, 0.85)";
        if (val < 65) return "rgba(214, 0, 0, 0.90)";
        return "rgba(255, 0, 255, 0.92)";
      }

      if (prodKey === "vel") {
        // m/s radial velocity
        if (val < -25) return "rgba(0, 255, 255, 0.82)";
        if (val < -10) return "rgba(0, 128, 255, 0.78)";
        if (val < -2) return "rgba(0, 200, 90, 0.70)";
        if (val <= 2) return "rgba(140, 140, 140, 0.35)";
        if (val <= 10) return "rgba(255, 140, 140, 0.70)";
        if (val <= 25) return "rgba(255, 40, 40, 0.80)";
        return "rgba(255, 0, 220, 0.88)";
      }

      if (prodKey === "sw") {
        // m/s spectrum width
        if (val < 2) return "rgba(56, 189, 248, 0.55)";
        if (val < 5) return "rgba(34, 197, 94, 0.72)";
        if (val < 9) return "rgba(250, 204, 21, 0.82)";
        return "rgba(244, 63, 94, 0.88)";
      }

      // Correlation coefficient (RHOHV: ~0.2 to 1.05)
      if (val < 0.5) return "rgba(239, 68, 68, 0.85)";
      if (val < 0.75) return "rgba(245, 158, 11, 0.80)";
      if (val < 0.92) return "rgba(56, 189, 248, 0.72)";
      return "rgba(34, 197, 94, 0.65)";
    }

    function getMomentFieldName(prodKey) {
      if (prodKey === "vel") return "VEL";
      if (prodKey === "sw") return "SW";
      if (prodKey === "cc") return "RHO";
      return "REF";
    }

    function destinationLatLon(latDeg, lonDeg, bearingDeg, distanceKm) {
      const R = 6371.0;
      const brng = (bearingDeg * Math.PI) / 180;
      const lat1 = (latDeg * Math.PI) / 180;
      const lon1 = (lonDeg * Math.PI) / 180;
      const dDivR = distanceKm / R;

      const lat2 = Math.asin(
        Math.sin(lat1) * Math.cos(dDivR) +
        Math.cos(lat1) * Math.sin(dDivR) * Math.cos(brng)
      );
      const lon2 =
        lon1 +
        Math.atan2(
          Math.sin(brng) * Math.sin(dDivR) * Math.cos(lat1),
          Math.cos(dDivR) - Math.sin(lat1) * Math.sin(lat2)
        );

      return {
        lat: (lat2 * 180) / Math.PI,
        lon: (lon2 * 180) / Math.PI
      };
    }

    function clearCanvasAndShowFallback() {
      const canvas = document.getElementById("level2Canvas");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        if (ctx) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      const radarObj = getActiveRadarObj();
      const ridgeProd = getRidgeProductCode();
      const activeFrame = scanFrames[currentFrameIndex] || null;

      if (map && typeof L.tileLayer.wms === "function") {
        let wmsUrl =
          "https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/ridge.cgi?sector=" +
          encodeURIComponent(radarObj.sector) +
          "&prod=" +
          encodeURIComponent(ridgeProd);

        if (activeFrame && activeFrame.timestamp) {
          wmsUrl += "&timestamp=" + encodeURIComponent(activeFrame.timestamp);
        }

        if (!fallbackWmsLayer) {
          fallbackWmsLayer = L.tileLayer.wms(wmsUrl, {
            layers: "single",
            format: "image/png",
            transparent: true,
            opacity: 0.72,
            attribution: "NEXRAD / Iowa Environmental Mesonet (IEM)",
            _t: Date.now()
          });
          fallbackWmsLayer.addTo(map);
        } else {
          fallbackWmsLayer.setUrl(wmsUrl, false);
          fallbackWmsLayer.setParams({ _t: Date.now() }, false);
          if (!map.hasLayer(fallbackWmsLayer)) {
            fallbackWmsLayer.addTo(map);
          }
        }
      }
    }

    function hideFallbackWmsLayer() {
      if (map && fallbackWmsLayer && map.hasLayer(fallbackWmsLayer)) {
        map.removeLayer(fallbackWmsLayer);
      }
    }

    function renderDecodedSweepToCanvas() {
      const canvas = document.getElementById("level2Canvas");
      const statusEl = document.getElementById("radarFeedStatus");
      const radarObj = getActiveRadarObj();

      if (!canvas || !map) {
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const targetW = Math.max(1, Math.floor(rect.width * dpr));
      const targetH = Math.max(1, Math.floor(rect.height * dpr));

      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }

      const ctx = canvas.getContext("2d");
      if (!ctx) {
        return;
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);

      const sweep = pickSweepForSelectedElevation(currentDecodedVolume);
      if (!sweep || !sweep.radials || sweep.radials.length === 0) {
        clearCanvasAndShowFallback();
        if (statusEl) {
          statusEl.textContent =
            radarObj.id + " • Tilt " + selectedElevation.angle + " • Fallback WMS";
        }
        return;
      }

      const momentKey = getMomentFieldName(selectedProductKey);
      let hasAnyMoment = false;
      for (let i = 0; i < sweep.radials.length; i++) {
        if (sweep.radials[i].moments && sweep.radials[i].moments[momentKey]) {
          hasAnyMoment = true;
          break;
        }
      }

      if (!hasAnyMoment) {
        clearCanvasAndShowFallback();
        if (statusEl) {
          statusEl.textContent =
            radarObj.id + " • No " + momentKey + " sweep • Fallback WMS";
        }
        return;
      }

      hideFallbackWmsLayer();

      const centerPt = map.latLngToContainerPoint([radarObj.lat, radarObj.lon]);

      for (let r = 0; r < sweep.radials.length; r++) {
        const radial = sweep.radials[r];
        const mData = radial.moments ? radial.moments[momentKey] : null;
        if (!mData || !mData.values) {
          continue;
        }

        const azStart = radial.azimuth - radial.azWidthDeg * 0.5;
        const azEnd = radial.azimuth + radial.azWidthDeg * 0.5;
        const rad1 = ((azStart - 90) * Math.PI) / 180;
        const rad2 = ((azEnd - 90) * Math.PI) / 180;

        // Estimate pixels-per-km scale at radar location for fast gate rendering
        const refOuter = destinationLatLon(radarObj.lat, radarObj.lon, radial.azimuth, 100);
        const outerPt = map.latLngToContainerPoint([refOuter.lat, refOuter.lon]);
        const pxPerKm = Math.hypot(outerPt.x - centerPt.x, outerPt.y - centerPt.y) / 100.0;

        let g = 0;
        while (g < mData.gateCount) {
          const val = mData.values[g];
          const color = getMomentColor(selectedProductKey, val);
          if (!color) {
            g++;
            continue;
          }

          // Merge consecutive gates with the same color bucket to reduce draw calls
          let runEnd = g + 1;
          while (runEnd < mData.gateCount) {
            const nextColor = getMomentColor(selectedProductKey, mData.values[runEnd]);
            if (nextColor !== color) {
              break;
            }
            runEnd++;
          }

          const rInnerPx = (mData.firstGateKm + g * mData.gateIntervalKm) * pxPerKm;
          const rOuterPx = (mData.firstGateKm + runEnd * mData.gateIntervalKm) * pxPerKm;

          ctx.beginPath();
          ctx.arc(centerPt.x, centerPt.y, rOuterPx, rad1, rad2, false);
          ctx.arc(centerPt.x, centerPt.y, Math.max(0, rInnerPx), rad2, rad1, true);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();

          g = runEnd;
        }
      }

      if (statusEl) {
        statusEl.textContent =
          radarObj.id +
          " • L2 " +
          momentKey +
          " • " +
          sweep.elevAngle.toFixed(1) +
          "°";
      }
    }

    function loadLevel2FrameIntoView() {
      const activeFrame = scanFrames[currentFrameIndex] || null;
      const statusEl = document.getElementById("radarFeedStatus");
      const radarObj = getActiveRadarObj();

      if (!activeFrame || !activeFrame.s3Key) {
        currentDecodedVolume = null;
        clearCanvasAndShowFallback();
        return;
      }

      if (decodedVolumeCache.has(activeFrame.s3Key)) {
        currentDecodedVolume = decodedVolumeCache.get(activeFrame.s3Key);
        renderDecodedSweepToCanvas();
        return;
      }

      if (statusEl) {
        statusEl.textContent = radarObj.id + " • Decoding L2...";
      }

      const token = ++fetchToken;
      const fileUrl = S3_BUCKET_URL + "/" + encodeURI(activeFrame.s3Key);

      fetch(fileUrl)
        .then(function (res) {
          if (!res.ok) {
            throw new Error("HTTP " + res.status);
          }
          return res.arrayBuffer();
        })
        .then(function (buf) {
          if (token !== fetchToken) {
            return;
          }
          const parsed = parseNexradLevel2Buffer(buf);
          if (parsed) {
            decodedVolumeCache.set(activeFrame.s3Key, parsed);
            currentDecodedVolume = parsed;
            renderDecodedSweepToCanvas();
          } else {
            currentDecodedVolume = null;
            clearCanvasAndShowFallback();
            if (statusEl) {
              statusEl.textContent = radarObj.id + " • L2 parse fallback";
            }
          }
        })
        .catch(function () {
          if (token !== fetchToken) {
            return;
          }
          currentDecodedVolume = null;
          clearCanvasAndShowFallback();
          if (statusEl) {
            statusEl.textContent = radarObj.id + " • WMS fallback";
          }
        });
    }

    function renderPlayerAndElevations() {
      const radarObj = getActiveRadarObj();
      const fileEl = document.getElementById("scanFileName");
      const countEl = document.getElementById("scanFrameCount");
      const elevHeader = document.getElementById("elevHeaderTitle");
      const elevGrid = document.getElementById("elevGrid");

      const activeFrame = scanFrames[currentFrameIndex] || null;

      if (fileEl) {
        fileEl.textContent = activeFrame ? activeFrame.filename : "No scans loaded";
      }

      if (countEl) {
        if (scanFrames.length > 0) {
          countEl.textContent = (currentFrameIndex + 1) + "/" + scanFrames.length;
        } else {
          countEl.textContent = "0/0";
        }
      }

      if (elevHeader) {
        elevHeader.textContent = radarObj.id + " elevations";
      }

      if (elevGrid) {
        elevGrid.innerHTML = "";
        ELEVATION_LEVELS.forEach(function (elev) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className =
            "elev-item" + (elev.angle === selectedElevation.angle ? " active" : "");

          const badgeCount = scanFrames.length > 0 ? scanFrames.length : 1;
          btn.innerHTML =
            "<span>" + elev.angle + "</span>" +
            '<span class="elev-badge">' + badgeCount + "</span>";

          btn.addEventListener("click", function () {
            selectedElevation = elev;
            renderPlayerAndElevations();
            if (currentDecodedVolume) {
              renderDecodedSweepToCanvas();
            } else {
              loadLevel2FrameIntoView();
            }
          });

          elevGrid.appendChild(btn);
        });
      }
    }

    function parseNexradFilenameToTimestamp(filename) {
      const match = filename.match(/^[A-Z]{4}(\d{8})_(\d{4})/);
      if (!match) {
        return null;
      }
      return match[1] + match[2];
    }

    function fetchRecentScansForSite(preserveLatest) {
      const radarObj = getActiveRadarObj();
      const now = new Date();
      const yyyy = String(now.getUTCFullYear());
      const mm = String(now.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(now.getUTCDate()).padStart(2, "0");
      const prefix = yyyy + "/" + mm + "/" + dd + "/" + radarObj.id + "/";
      const listUrl =
        S3_BUCKET_URL + "/?list-type=2&prefix=" + encodeURIComponent(prefix);

      fetch(listUrl)
        .then(function (res) {
          return res.text();
        })
        .then(function (xmlText) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, "application/xml");
          const keyNodes = xmlDoc.getElementsByTagName("Key");
          const parsed = [];

          for (let i = 0; i < keyNodes.length; i++) {
            const fullKey = keyNodes[i].textContent || "";
            const parts = fullKey.split("/");
            const filename = parts[parts.length - 1];
            if (!filename || filename.indexOf("_MDM") !== -1) {
              continue;
            }
            const ts = parseNexradFilenameToTimestamp(filename);
            if (ts) {
              parsed.push({
                filename: filename,
                s3Key: fullKey,
                timestamp: ts
              });
            }
          }

          if (parsed.length > 0) {
            const wasAtLatest =
              scanFrames.length === 0 || currentFrameIndex === scanFrames.length - 1;

            scanFrames = parsed.slice(-MAX_LOOP_FRAMES);

            if (preserveLatest || wasAtLatest || currentFrameIndex >= scanFrames.length) {
              currentFrameIndex = scanFrames.length - 1;
            }
          } else {
            const fallbackStamp = yyyy + mm + dd + "_" +
              String(now.getUTCHours()).padStart(2, "0") +
              String(now.getUTCMinutes()).padStart(2, "0") + "00";
            scanFrames = [
              {
                filename: radarObj.id + fallbackStamp + "_V06",
                s3Key: null,
                timestamp: null
              }
            ];
            currentFrameIndex = 0;
          }

          renderPlayerAndElevations();
          loadLevel2FrameIntoView();
        })
        .catch(function () {
          const fallbackStamp = yyyy + mm + dd + "_" +
            String(now.getUTCHours()).padStart(2, "0") +
            String(now.getUTCMinutes()).padStart(2, "0") + "00";
          scanFrames = [
            {
              filename: radarObj.id + fallbackStamp + "_V06",
              s3Key: null,
              timestamp: null
            }
          ];
          currentFrameIndex = 0;
          renderPlayerAndElevations();
          loadLevel2FrameIntoView();
        });
    }

    function stopLoopPlayback() {
      isPlaying = false;
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
      const playBtn = document.getElementById("btnPlayLoop");
      if (playBtn) {
        playBtn.classList.remove("playing");
        playBtn.innerHTML = "&#9654;";
      }
    }

    function startLoopPlayback() {
      if (scanFrames.length <= 1) {
        return;
      }
      isPlaying = true;
      const playBtn = document.getElementById("btnPlayLoop");
      if (playBtn) {
        playBtn.classList.add("playing");
        playBtn.innerHTML = "&#10074;&#10074;";
      }
      playTimer = setInterval(function () {
        if (scanFrames.length === 0) {
          return;
        }
        currentFrameIndex = (currentFrameIndex + 1) % scanFrames.length;
        renderPlayerAndElevations();
        loadLevel2FrameIntoView();
      }, 900);
    }

    function refreshMapSiteNames() {
      if (!map) {
        return;
      }

      OK_PRIMARY_RADARS.forEach(function (radar) {
        const layer = radarNameLayers[radar.id];
        if (!layer) {
          return;
        }

        if (siteNamesVisible) {
          if (!map.hasLayer(layer)) {
            layer.addTo(map);
          }
          const el = layer.getElement();
          const textSpan = el ? el.querySelector(".map-site-text") : null;
          if (textSpan) {
            textSpan.classList.toggle("selected", selectedRadarId === radar.id);
          }
        } else if (map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });

      renderPlayerAndElevations();
    }

    function applyMapStyle(styleName) {
      if (!map || !darkMinimalLayer || !detailedOSMLayer) {
        return;
      }

      const darkBtn = document.getElementById("styleDarkMinimal");
      const osmBtn = document.getElementById("styleDetailedOSM");

      if (styleName === "detailed") {
        if (map.hasLayer(darkMinimalLayer)) {
          map.removeLayer(darkMinimalLayer);
        }
        if (!map.hasLayer(detailedOSMLayer)) {
          detailedOSMLayer.addTo(map);
        }
        if (osmBtn) {
          osmBtn.classList.add("active");
        }
        if (darkBtn) {
          darkBtn.classList.remove("active");
        }
      } else {
        if (map.hasLayer(detailedOSMLayer)) {
          map.removeLayer(detailedOSMLayer);
        }
        if (!map.hasLayer(darkMinimalLayer)) {
          darkMinimalLayer.addTo(map);
        }
        if (darkBtn) {
          darkBtn.classList.add("active");
        }
        if (osmBtn) {
          osmBtn.classList.remove("active");
        }
      }

      try {
        localStorage.setItem("t101_map_style", styleName);
      } catch (err) {
        // Ignore storage errors
      }
    }

    renderPlayerAndElevations();

    const btnPrevFrame = document.getElementById("btnPrevFrame");
    const btnNextFrame = document.getElementById("btnNextFrame");
    const btnPlayLoop = document.getElementById("btnPlayLoop");
    const btnRefreshScans = document.getElementById("btnRefreshScans");

    if (btnPrevFrame) {
      btnPrevFrame.addEventListener("click", function () {
        if (scanFrames.length === 0) {
          return;
        }
        stopLoopPlayback();
        currentFrameIndex = (currentFrameIndex - 1 + scanFrames.length) % scanFrames.length;
        renderPlayerAndElevations();
        loadLevel2FrameIntoView();
      });
    }

    if (btnNextFrame) {
      btnNextFrame.addEventListener("click", function () {
        if (scanFrames.length === 0) {
          return;
        }
        stopLoopPlayback();
        currentFrameIndex = (currentFrameIndex + 1) % scanFrames.length;
        renderPlayerAndElevations();
        loadLevel2FrameIntoView();
      });
    }

    if (btnPlayLoop) {
      btnPlayLoop.addEventListener("click", function () {
        if (isPlaying) {
          stopLoopPlayback();
        } else {
          startLoopPlayback();
        }
      });
    }

    if (btnRefreshScans) {
      btnRefreshScans.addEventListener("click", function () {
        stopLoopPlayback();
        fetchRecentScansForSite(true);
      });
    }

    const btnSiteNames = document.getElementById("btnSiteNames");
    if (btnSiteNames) {
      btnSiteNames.addEventListener("click", function () {
        siteNamesVisible = !siteNamesVisible;
        btnSiteNames.classList.toggle("active", siteNamesVisible);
        refreshMapSiteNames();
      });
    }

    const btnWeatherVersion = document.getElementById("btnWeatherVersion");
    const btnAllVersion = document.getElementById("btnAllVersion");
    const btnWarnings = document.getElementById("btnWarnings");
    const btnConfirmed = document.getElementById("btnConfirmed");

    if (btnWeatherVersion && btnAllVersion) {
      btnWeatherVersion.addEventListener("click", function () {
        mode = "weather";
        btnWeatherVersion.classList.add("active");
        btnAllVersion.classList.remove("active");
        updateWarningsDisplay();
      });

      btnAllVersion.addEventListener("click", function () {
        mode = "all";
        btnAllVersion.classList.add("active");
        btnWeatherVersion.classList.remove("active");
        updateWarningsDisplay();
      });
    }

    if (btnWarnings) {
      btnWarnings.addEventListener("click", function () {
        warningsEnabled = !warningsEnabled;
        btnWarnings.classList.toggle("active", warningsEnabled);
        updateWarningsDisplay();
      });
    }

    if (btnConfirmed) {
      btnConfirmed.addEventListener("click", function () {
        confirmedOnly = !confirmedOnly;
        btnConfirmed.classList.toggle("active", confirmedOnly);
        updateWarningsDisplay();
      });
    }

    ["btnReports", "btnOutlook", "btnMD"].forEach(function (id) {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener("click", function () {
          btn.classList.toggle("active");
        });
      }
    });

    const prodButtons = document.querySelectorAll(".prod-btn");
    prodButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        prodButtons.forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        selectedProductKey = btn.getAttribute("data-prod") || "ref";
        if (currentDecodedVolume) {
          renderDecodedSweepToCanvas();
        } else {
          loadLevel2FrameIntoView();
        }
      });
    });

    if (typeof L !== "undefined") {
      map = L.map("map").setView([35.3334, -97.2779], 8);

      const cleanKey = CARTO_API_KEY.trim();
      const cartoUrl = cleanKey
        ? "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=" +
          encodeURIComponent(cleanKey)
        : "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png";

      darkMinimalLayer = L.tileLayer(cartoUrl, {
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
        maxZoom: 20
      });

      detailedOSMLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      });

      let savedStyle = "dark";
      try {
        savedStyle = localStorage.getItem("t101_map_style") || "dark";
      } catch (err) {
        savedStyle = "dark";
      }
      applyMapStyle(savedStyle);

      map.on("move zoom resize viewreset", function () {
        if (currentDecodedVolume) {
          renderDecodedSweepToCanvas();
        }
      });

      fetchRecentScansForSite(true);
      setInterval(function () {
        fetchRecentScansForSite(false);
      }, 300000);

      OK_PRIMARY_RADARS.forEach(function (radar) {
        const labelIcon = L.divIcon({
          className: "",
          html: '<span class="map-site-text">' + radar.id + "</span>",
          iconSize: [44, 18],
          iconAnchor: [22, 9]
        });

        const labelMarker = L.marker([radar.lat, radar.lon], {
          icon: labelIcon,
          interactive: true
        });

        labelMarker.on("click", function () {
          stopLoopPlayback();
          selectedRadarId = radar.id;
          scanFrames = [];
          currentFrameIndex = 0;
          currentDecodedVolume = null;
          refreshMapSiteNames();
          fetchRecentScansForSite(true);
        });

        radarNameLayers[radar.id] = labelMarker;
      });

      refreshMapSiteNames();

      const styleDarkBtn = document.getElementById("styleDarkMinimal");
      const styleOSMBtn = document.getElementById("styleDetailedOSM");

      if (styleDarkBtn) {
        styleDarkBtn.addEventListener("click", function () {
          applyMapStyle("dark");
        });
      }

      if (styleOSMBtn) {
        styleOSMBtn.addEventListener("click", function () {
          applyMapStyle("detailed");
        });
      }

      sampleWarnings = [
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.390, -98.02, 35.425, -97.96, "#ffea00", "Severe Thunderstorm Warning (Base)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.350, -98.02, 35.385, -97.96, "#d4ac0d", "Severe Thunderstorm Warning (Considerable)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -98.02, 35.345, -97.96, "#8a6d00", "Severe Thunderstorm Warning (Destructive)")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -97.95, 35.425, -97.89, "#e60000", "Tornado Warning")
        },
        {
          type: "weather",
          confirmed: true,
          layer: makeBox(35.310, -97.88, 35.425, -97.82, "#800000", "Tornado Warning (PDS)")
        },
        {
          type: "weather",
          confirmed: true,
          layer: makeBox(35.310, -97.81, 35.425, -97.75, "#d946ef", "Tornado Emergency")
        },
        {
          type: "weather",
          confirmed: false,
          layer: makeBox(35.310, -97.74, 35.425, -97.68, "#16a34a", "Flood Warning")
        },
        {
          type: "other",
          confirmed: false,
          layer: makeBox(35.310, -97.67, 35.425, -97.61, "#ff4da6", "Snow Warning")
        },
        {
          type: "other",
          confirmed: false,
          layer: makeBox(35.310, -97.60, 35.425, -97.54, "#a855f7", "Wind / Gale Warning")
        }
      ];

      updateWarningsDisplay();

      const searchForm = document.getElementById("searchForm");
      if (searchForm) {
        searchForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const input = document.getElementById("searchInput");
          const query = input ? input.value.trim() : "";
          if (!query) {
            return;
          }

          fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(query))
            .then(function (res) {
              return res.json();
            })
            .then(function (results) {
              if (results && results.length > 0 && map) {
                map.setView([parseFloat(results[0].lat), parseFloat(results[0].lon)], 10);
              }
            })
            .catch(function () {
              // Ignore network errors
            });
        });
      }
    }
  </script>
</body>
</html>
