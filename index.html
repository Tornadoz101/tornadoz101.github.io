<!DOCTYPE html>
<html>
<head>
  <title>Tornadoz101 Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      background-color: #111;
      color: #f5f5f5;
      font-family: sans-serif;
    }

    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Full-height left panel (empty slots, no labels) */
    .left-menu {
      width: 240px;
      height: 100%;
      background-color: #1c1c1c;
      padding: 12px;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .panel-slot {
      background-color: #242424;
      border: 1px dashed #3a3a3a;
      border-radius: 6px;
      min-height: 64px;
    }

    .panel-slot.tall {
      flex: 1;
      min-height: 140px;
    }

    /* Right column: Top Bar + Map */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .top-menu {
      min-height: 56px;
      background-color: #1c1c1c;
      padding: 8px 14px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Buttons: Light blue = unselected */
    .top-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background-color: #7cc4fa; /* Light blue = unselected */
      color: #0b192c;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .top-btn.active {
      background-color: #1d4ed8; /* Darker blue = selected */
      color: #ffffff;
      box-shadow: inset 0 0 0 2px #93c5fd;
    }

    #map {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- LEFT SIDEBAR: Empty positioned containers (no labels) -->
    <aside class="left-menu">
      <div class="panel-slot" id="slot-site-info"></div>
      <div class="panel-slot" id="slot-products"></div>
      <div class="panel-slot" id="slot-tilts"></div>
      <div class="panel-slot tall" id="slot-details"></div>
    </aside>

    <!-- RIGHT SIDE: TOP BUTTON BAR + MAP -->
    <div class="right-column">
      <header class="top-menu">
        <button type="button" class="top-btn active" id="btnWeather">Weather Version</button>
        <button type="button" class="top-btn" id="btnAll">All Version</button>
        <button type="button" class="top-btn" id="btnOutlook">Outlook</button>
        <button type="button" class="top-btn" id="btnMD">Mesoscale Discussions</button>
      </header>

      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Centered just south of El Reno, OK so all sample polygons are visible
    const map = L.map('map').setView([35.35, -97.80], 10);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Layer groups for filtering
    const weatherWarningsLayer = L.layerGroup().addTo(map);
    const nonWeatherWarningsLayer = L.layerGroup(); // Hidden initially because Weather Version starts active

    // Helper to build a rectangle polygon [southLat, westLng, northLat, eastLng]
    function makeBox(s, w, n, e, color, label) {
      return L.rectangle([[s, w], [n, e]], {
        color: color,
        fillColor: color,
        fillOpacity: 0.45,
        weight: 2
      }).bindPopup(label);
    }

    // --- SAMPLE WARNINGS IN A ROW SOUTH OF EL RENO (lat ~35.30 to 35.42) ---
    // Column 1: 3 Thunderstorm warning levels stacked vertically (yellow -> dark yellow)
    makeBox(35.385, -98.02, 35.420, -97.96, '#ffea00', 'Severe Thunderstorm Warning (Base)').addTo(weatherWarningsLayer);
    makeBox(35.345, -98.02, 35.380, -97.96, '#d4ac0d', 'Severe Thunderstorm Warning (Considerable)').addTo(weatherWarningsLayer);
    makeBox(35.305, -98.02, 35.340, -97.96, '#8a6d00', 'Severe Thunderstorm Warning (Destructive)').addTo(weatherWarningsLayer);

    // Column 2: Tornado Warning (Red)
    makeBox(35.305, -97.95, 35.420, -97.89, '#e60000', 'Tornado Warning').addTo(weatherWarningsLayer);

    // Column 3: Tornado PDS (Maroon)
    makeBox(35.305, -97.88, 35.420, -97.82, '#800000', 'Tornado Warning (PDS)').addTo(weatherWarningsLayer);

    // Column 4: Tornado Emergency (Pinkish Purple)
    makeBox(35.305, -97.81, 35.420, -97.75, '#d946ef', 'Tornado Emergency').addTo(weatherWarningsLayer);

    // Column 5: Flood Warning (Green)
    makeBox(35.305, -97.74, 35.420, -97.68, '#16a34a', 'Flood Warning').addTo(weatherWarningsLayer);

    // Column 6: Snow Warning (Bright Pink) - All Version only
    makeBox(35.305, -97.67, 35.420, -97.61, '#ff4da6', 'Snow / Winter Storm Warning').addTo(nonWeatherWarningsLayer);

    // Column 7: Wind / Gale Warning (Bright Purple) - All Version only
    makeBox(35.305, -97.60, 35.420, -97.54, '#a855f7', 'Wind / Gale Warning').addTo(nonWeatherWarningsLayer);

    // --- BUTTON LOGIC ---
    const btnWeather = document.getElementById('btnWeather');
    const btnAll = document.getElementById('btnAll');
    const btnOutlook = document.getElementById('btnOutlook');
    const btnMD = document.getElementById('btnMD');

    // Mutually exclusive: Weather Version vs All Version
    btnWeather.addEventListener('click', () => {
      btnWeather.classList.add('active');
      btnAll.classList.remove('active');
      if (map.hasLayer(nonWeatherWarningsLayer)) {
        map.removeLayer(nonWeatherWarningsLayer);
      }
    });

    btnAll.addEventListener('click', () => {
      btnAll.classList.add('active');
      btnWeather.classList.remove('active');
      if (!map.hasLayer(nonWeatherWarningsLayer)) {
        nonWeatherWarningsLayer.addTo(map);
      }
    });

    // Independent toggles for Outlook & Mesoscale Discussions
    btnOutlook.addEventListener('click', () => {
      btnOutlook.classList.toggle('active');
    });

    btnMD.addEventListener('click', () => {
      btnMD.classList.toggle('active');
    });
  </script>
</body>
</html>
