<!DOCTYPE html>
<html>
<head>
  <title>Tornadoz101's Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #ffffff;
      color: #111111;
      font-family: sans-serif;
    }

    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    /* LEFT COLUMN */
    .left-column {
      width: 210px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      border-right: 3px solid #000000;
      flex-shrink: 0;
    }

    .brand-box {
      height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid #000000;
      padding: 2px 8px;
      text-align: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-version {
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
      margin-top: 2px;
      line-height: 1;
    }

    .left-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 6px;
      min-height: 0;
    }

    .empty-slots {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px;
    }

    .radar-slot {
      min-height: 32px;
    }

    .angle-slot {
      min-height: 48px;
    }

    .product-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prod-btn {
      width: 100%;
      padding: 6px 8px;
      background-color: #ffffff;
      color: #111111;
      font-size: 14px;
      font-weight: 800;
      border-radius: 0;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .prod-reflectivity { border-color: #1d4ed8; }
    .prod-reflectivity.active { background-color: #1d4ed8; color: #ffffff; }

    .prod-velocity { border-color: #22c55e; }
    .prod-velocity.active { background-color: #22c55e; color: #052e16; }

    .prod-spectrum { border-color: #6b7280; }
    .prod-spectrum.active { background-color: #6b7280; color: #ffffff; }

    .prod-cc { border-color: #f43f5e; }
    .prod-cc.active { background-color: #f43f5e; color: #ffffff; }

    /* RIGHT COLUMN */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .top-bar {
      min-height: 56px;
      background: linear-gradient(to right, #ffffff 75%, #e5e7eb 100%);
      border-bottom: 3px solid #000000;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(96px, auto));
      grid-template-rows: repeat(2, auto);
      gap: 4px 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      padding: 3px 10px;
      border-radius: 999px;
      border: 2px solid #7cc4fa;
      background-color: #ffffff;
      color: #111111;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .top-center-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 140px;
    }

    .utc-clock {
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #111827;
      letter-spacing: 0.4px;
      line-height: 1;
    }

    .search-form {
      display: flex;
      width: 100%;
      max-width: 220px;
      height: 22px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      border: 2px solid #9ca3af;
      border-right: none;
      border-radius: 999px 0 0 999px;
      outline: none;
      background-color: #ffffff;
      color: #111111;
    }

    .search-input:focus {
      border-color: #1d4ed8;
    }

    .search-go {
      padding: 0 9px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid #1d4ed8;
      border-radius: 0 999px 999px 0;
      background-color: #1d4ed8;
      color: #ffffff;
      cursor: pointer;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .settings-btn:hover,
    .settings-btn.active {
      color: #374151;
    }

    .account-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 2px solid #111111;
      background-color: #111111;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .account-btn.signed-in {
      background-color: #16a34a;
      border-color: #15803d;
      color: #ffffff;
    }

    .map-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
    }

    .popup-panel {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: 250px;
      background-color: #ffffff;
      border: 3px solid #000000;
      z-index: 1000;
      padding: 12px;
      font-size: 12px;
    }

    .popup-panel.open {
      display: block;
    }

    .provider-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .provider-btn {
      width: 100%;
      padding: 7px 10px;
      border: 2px solid #111111;
      background-color: #ffffff;
      color: #111111;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .provider-btn:hover {
      background-color: #f3f4f6;
    }

    .provider-btn.primary {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .account-signout {
      width: 100%;
      margin-top: 10px;
      padding: 6px;
      border: none;
      background-color: #dc2626;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 800;
    }

    .status-locked {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .status-unlocked {
      background-color: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="left-column">
      <div class="brand-box">
        <div class="brand-title">Tornadoz101’s Radar</div>
        <div class="brand-version">Version 1.0</div>
      </div>

      <div class="left-body">
        <div class="empty-slots">
          <div class="radar-slot" id="slot-radar-name"></div>
          <div class="angle-slot" id="slot-site-angles"></div>
        </div>

        <div class="product-buttons">
          <button type="button" class="prod-btn prod-reflectivity active" data-prod="ref">Reflectivity</button>
          <button type="button" class="prod-btn prod-velocity" data-prod="vel">Velocity</button>
          <button type="button" class="prod-btn prod-spectrum" data-prod="sw">Spectrum Width</button>
          <button type="button" class="prod-btn prod-cc" data-prod="cc">CC</button>
        </div>
      </div>
    </aside>

    <div class="right-column">
      <header class="top-bar">
        <div class="pill-grid">
          <button type="button" class="pill-btn" id="btnSiteNames">Site Names</button>
          <button type="button" class="pill-btn" id="btnAllVersion">All Version</button>
          <button type="button" class="pill-btn" id="btnReports">Reports</button>
          <button type="button" class="pill-btn" id="btnOutlook">Outlook</button>

          <button type="button" class="pill-btn active" id="btnWeatherVersion">Weather Version</button>
          <button type="button" class="pill-btn active" id="btnWarnings">Warnings</button>
          <button type="button" class="pill-btn" id="btnConfirmed">Confirmed</button>
          <button type="button" class="pill-btn" id="btnMD">MD</button>
        </div>

        <div class="top-center-stack">
          <div class="utc-clock" id="utcClock">--:--:-- UTC</div>
          <form class="search-form" id="searchForm">
            <input type="text" class="search-input" id="searchInput" placeholder="Search city or state...">
            <button type="submit" class="search-go">Go</button>
          </form>
        </div>

        <div class="top-right-group">
          <button type="button" class="settings-btn" id="btnSettings">Settings ⚙️</button>
          <button type="button" class="account-btn" id="btnAccount">Sign In</button>
        </div>
      </header>

      <div class="map-wrap">
        <div id="map"></div>
        <div class="popup-panel" id="settingsModal" style="min-height: 140px;"></div>
        <div class="popup-panel" id="accountModal"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. UTC Clock (runs independently so it always ticks)
    function updateUTCClock() {
      const clockEl = document.getElementById('utcClock');
      if (!clockEl) return;
      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, '0');
      const mm = String(now.getUTCMinutes()).padStart(2, '0');
      const ss = String(now.getUTCSeconds()).padStart(2, '0');
      clockEl.textContent = hh + ':' + mm + ':' + ss + ' UTC';
    }
    updateUTCClock();
    setInterval(updateUTCClock, 1000);

    // 2. Settings & Account Menus (wired independently so they always open/close)
    const btnSettings = document.getElementById('btnSettings');
    const settingsModal = document.getElementById('settingsModal');
    const btnAccount = document.getElementById('btnAccount');
    const accountModal = document.getElementById('accountModal');

    let currentUser = null;
    try {
      currentUser = JSON.parse(localStorage.getItem('t101_user') || 'null');
    } catch (e) {
      currentUser = null;
    }

    function signInWithProvider(providerName) {
      currentUser = {
        provider: providerName,
        label: providerName + ' Account'
      };
      try {
        localStorage.setItem('t101_user', JSON.stringify(currentUser));
      } catch (e) {}
      renderAccountUI();
    }

    function renderAccountUI() {
      if (!btnAccount || !accountModal) return;
      if (currentUser) {
        btnAccount.textContent = currentUser.provider;
        btnAccount.classList.add('signed-in');
        accountModal.innerHTML =
          '<div style="font-weight:800;font-size:14px;">' + currentUser.label + '</div>' +
          '<div class="status-badge status-unlocked">Live Radar: Unlocked</div>' +
          '<button type="button" class="account-signout" id="btnSignOut">Sign Out</button>';
        const signOutBtn = document.getElementById('btnSignOut');
        if (signOutBtn) {
          signOutBtn.addEventListener('click', function () {
            currentUser = null;
            try {
              localStorage.removeItem('t101_user');
            } catch (e) {}
            renderAccountUI();
          });
        }
      } else {
        btnAccount.textContent = 'Sign In';
        btnAccount.classList.remove('signed-in');
        accountModal.innerHTML =
          '<div style="font-weight:800;font-size:13px;">Sign in to view live radar</div>' +
          '<div class="status-badge status-locked">Live Radar: Locked</div>' +
          '<div class="provider-list">' +
            '<button type="button" class="provider-btn primary" data-provider="Google">Continue with Google</button>' +
            '<button type="button" class="provider-btn" data-provider="GitHub">Continue with GitHub</button>' +
            '<button type="button" class="provider-btn" data-provider="Apple">Continue with Apple</button>' +
            '<button type="button" class="provider-btn" data-provider="Email">Continue with Email</button>' +
          '</div>';
        accountModal.querySelectorAll('.provider-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            signInWithProvider(btn.getAttribute('data-provider'));
          });
        });
      }
    }

    renderAccountUI();

    if (btnSettings && settingsModal) {
      btnSettings.addEventListener('click', function () {
        if (accountModal) accountModal.classList.remove('open');
        btnSettings.classList.toggle('active');
        settingsModal.classList.toggle('open');
      });
    }

    if (btnAccount && accountModal) {
      btnAccount.addEventListener('click', function () {
        if (settingsModal) settingsModal.classList.remove('open');
        if (btnSettings) btnSettings.classList.remove('active');
        accountModal.classList.toggle('open');
      });
    }

    // 3. Button Toggles
    let mode = 'weather';
    let warningsEnabled = true;
    let confirmedOnly = false;
    let map = null;
    let sampleWarnings = [];

    function makeBox(s, w, n, e, color, label) {
      return L.rectangle([[s, w], [n, e]], {
        color: color,
        fillColor: color,
        fillOpacity: 0.5,
        weight: 2
      }).bindPopup(label);
    }

    function updateWarningsDisplay() {
      if (!map) return;
      sampleWarnings.forEach(function (item) {
        const modeMatch = (mode === 'all') || (item.type === 'weather');
        const confirmedMatch = (!confirmedOnly) || item.confirmed;
        const shouldShow = warningsEnabled && modeMatch && confirmedMatch;

        if (shouldShow && !map.hasLayer(item.layer)) {
          item.layer.addTo(map);
        } else if (!shouldShow && map.hasLayer(item.layer)) {
          map.removeLayer(item.layer);
        }
      });
    }

    const btnWeatherVersion = document.getElementById('btnWeatherVersion');
    const btnAllVersion = document.getElementById('btnAllVersion');
    const btnWarnings = document.getElementById('btnWarnings');
    const btnConfirmed = document.getElementById('btnConfirmed');

    if (btnWeatherVersion && btnAllVersion) {
      btnWeatherVersion.addEventListener('click', function () {
        mode = 'weather';
        btnWeatherVersion.classList.add('active');
        btnAllVersion.classList.remove('active');
        updateWarningsDisplay();
      });

      btnAllVersion.addEventListener('click', function () {
        mode = 'all';
        btnAllVersion.classList.add('active');
        btnWeatherVersion.classList.remove('active');
        updateWarningsDisplay();
      });
    }

    if (btnWarnings) {
      btnWarnings.addEventListener('click', function () {
        warningsEnabled = !warningsEnabled;
        btnWarnings.classList.toggle('active', warningsEnabled);
        updateWarningsDisplay();
      });
    }

    if (btnConfirmed) {
      btnConfirmed.addEventListener('click', function () {
        confirmedOnly = !confirmedOnly;
        btnConfirmed.classList.toggle('active', confirmedOnly);
        updateWarningsDisplay();
      });
    }

    ['btnSiteNames', 'btnReports', 'btnOutlook', 'btnMD'].forEach(function (id) {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener('click', function () {
          btn.classList.toggle('active');
        });
      }
    });

    const prodButtons = document.querySelectorAll('.prod-btn');
    prodButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        prodButtons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });

    // 4. Map & Sample Warnings
    if (typeof L !== 'undefined') {
      map = L.map('map').setView([35.36, -97.78], 10);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      sampleWarnings = [
        { type: 'weather', confirmed: false, layer: makeBox(35.390, -98.02, 35.425, -97.96, '#ffea00', 'Severe Thunderstorm Warning (Base)') },
        { type: 'weather', confirmed: false, layer: makeBox(35.350, -98.02, 35.385, -97.96, '#d4ac0d', 'Severe Thunderstorm Warning (Considerable)') },
        { type: 'weather', confirmed: false, layer: makeBox(35.310, -98.02, 35.345, -97.96, '#8a6d00', 'Severe Thunderstorm Warning (Destructive)') },
        { type: 'weather', confirmed: false, layer: makeBox(35.310, -97.95, 35.425, -97.89, '#e60000', 'Tornado Warning') },
        { type: 'weather', confirmed: true, layer: makeBox(35.310, -97.88, 35.425, -97.82, '#800000', 'Tornado Warning (PDS)') },
        { type: 'weather', confirmed: true, layer: makeBox(35.310, -97.81, 35.425, -97.75, '#d946ef', 'Tornado Emergency') },
        { type: 'weather', confirmed: false, layer: makeBox(35.310, -97.74, 35.425, -97.68, '#16a34a', 'Flood Warning') },
        { type: 'other', confirmed: false, layer: makeBox(35.310, -97.67, 35.425, -97.61, '#ff4da6', 'Snow Warning') },
        { type: 'other', confirmed: false, layer: makeBox(35.310, -97.60, 35.425, -97.54, '#a855f7', 'Wind / Gale Warning') }
      ];

      updateWarningsDisplay();

      const searchForm = document.getElementById('searchForm');
      if (searchForm) {
        searchForm.addEventListener('submit', function (e) {
          e.preventDefault();
          const input = document.getElementById('searchInput');
          const query = input ? input.value.trim() : '';
          if (!query) return;
          fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query))
            .then(function (res) { return res.json(); })
            .then(function (results) {
              if (results && results.length > 0 && map) {
                map.setView([parseFloat(results[0].lat), parseFloat(results[0].lon)], 10);
              }
            })
            .catch(function () {});
        });
      }
    }
  </script>
</body>
</html>
