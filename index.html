<!DOCTYPE html>
<html>
<head>
  <title>Tornadoz101's Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --panel-bg: #1e293b;
      --panel-text: #ffffff;
      --muted-text: #cbd5e1;
      --border-color: #000000;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --top-bar-bg: linear-gradient(to right, #1e293b 75%, #334155 100%);
      --input-bg: #0f172a;
      --input-text: #ffffff;
      --input-border: #64748b;
      --settings-icon: #cbd5e1;
      --settings-hover: #ffffff;
      --popup-bg: #1e293b;
      --popup-text: #ffffff;
    }

    body.light-mode {
      --panel-bg: #ffffff;
      --panel-text: #111111;
      --muted-text: #6b7280;
      --border-color: #000000;
      --btn-bg: #ffffff;
      --btn-text: #111111;
      --top-bar-bg: linear-gradient(to right, #ffffff 75%, #e5e7eb 100%);
      --input-bg: #ffffff;
      --input-text: #111111;
      --input-border: #9ca3af;
      --settings-icon: #9ca3af;
      --settings-hover: #374151;
      --popup-bg: #ffffff;
      --popup-text: #111111;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      font-family: sans-serif;
    }

    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    /* LEFT COLUMN */
    .left-column {
      width: 210px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--panel-bg);
      color: var(--panel-text);
      border-right: 3px solid var(--border-color);
      flex-shrink: 0;
    }

    .brand-box {
      height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--border-color);
      padding: 2px 8px;
      text-align: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--panel-text);
    }

    .brand-version {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-text);
      margin-top: 2px;
      line-height: 1;
    }

    .left-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 6px;
      min-height: 0;
    }

    .empty-slots {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px;
    }

    .radar-slot {
      min-height: 32px;
    }

    .angle-slot {
      min-height: 48px;
    }

    .product-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prod-btn {
      width: 100%;
      padding: 6px 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 800;
      border-radius: 0;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .prod-reflectivity { border-color: #1d4ed8; }
    .prod-reflectivity.active { background-color: #1d4ed8; color: #ffffff; }

    .prod-velocity { border-color: #22c55e; }
    .prod-velocity.active { background-color: #22c55e; color: #052e16; }

    .prod-spectrum { border-color: #6b7280; }
    .prod-spectrum.active { background-color: #6b7280; color: #ffffff; }

    .prod-cc { border-color: #f43f5e; }
    .prod-cc.active { background-color: #f43f5e; color: #ffffff; }

    /* RIGHT COLUMN */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .top-bar {
      min-height: 56px;
      background: var(--top-bar-bg);
      color: var(--panel-text);
      border-bottom: 3px solid var(--border-color);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(96px, auto));
      grid-template-rows: repeat(2, auto);
      gap: 4px 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      padding: 3px 10px;
      border-radius: 999px;
      border: 2px solid #7cc4fa;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }

    .top-center-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 140px;
    }

    .utc-clock {
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--panel-text);
      letter-spacing: 0.4px;
      line-height: 1;
    }

    .search-form {
      display: flex;
      width: 100%;
      max-width: 220px;
      height: 22px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      border: 2px solid var(--input-border);
      border-right: none;
      border-radius: 999px 0 0 999px;
      outline: none;
      background-color: var(--input-bg);
      color: var(--input-text);
    }

    .search-input:focus {
      border-color: #1d4ed8;
    }

    .search-go {
      padding: 0 9px;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid #1d4ed8;
      border-radius: 0 999px 999px 0;
      background-color: #1d4ed8;
      color: #ffffff;
      cursor: pointer;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-right: 78px;
      flex-shrink: 0;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--settings-icon);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .settings-btn:hover,
    .settings-btn.active {
      color: var(--settings-hover);
    }

    .map-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      background-color: #18181b;
    }

    .popup-panel {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: 245px;
      min-height: 150px;
      background-color: var(--popup-bg);
      color: var(--popup-text);
      border: 3px solid var(--border-color);
      z-index: 1000;
      padding: 12px;
      font-size: 12px;
    }

    .popup-panel.open {
      display: block;
    }

    .settings-title {
      font-size: 13px;
      font-weight: 800;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .settings-title:first-child {
      margin-top: 0;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-row {
      display: flex;
      gap: 6px;
    }

    .opt-btn {
      flex: 1;
      width: 100%;
      padding: 7px 9px;
      border: 2px solid var(--input-border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .option-row .opt-btn {
      text-align: center;
    }

    .opt-btn.active {
      border-color: #1d4ed8;
      background-color: #1d4ed8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="left-column">
      <div class="brand-box">
        <div class="brand-title">Tornadoz101’s Radar</div>
        <div class="brand-version">Version 1.0</div>
      </div>

      <div class="left-body">
        <div class="empty-slots">
          <div class="radar-slot" id="slot-radar-name"></div>
          <div class="angle-slot" id="slot-site-angles"></div>
        </div>

        <div class="product-buttons">
          <button type="button" class="prod-btn prod-reflectivity active" data-prod="ref">Reflectivity</button>
          <button type="button" class="prod-btn prod-velocity" data-prod="vel">Velocity</button>
          <button type="button" class="prod-btn prod-spectrum" data-prod="sw">Spectrum Width</button>
          <button type="button" class="prod-btn prod-cc" data-prod="cc">CC</button>
        </div>
      </div>
    </aside>

    <div class="right-column">
      <header class="top-bar">
        <div class="pill-grid">
          <button type="button" class="pill-btn" id="btnSiteNames">Site Names</button>
          <button type="button" class="pill-btn" id="btnAllVersion">All Version</button>
          <button type="button" class="pill-btn" id="btnReports">Reports</button>
          <button type="button" class="pill-btn" id="btnOutlook">Outlook</button>

          <button type="button" class="pill-btn active" id="btnWeatherVersion">Weather Version</button>
          <button type="button" class="pill-btn active" id="btnWarnings">Warnings</button>
          <button type="button" class="pill-btn" id="btnConfirmed">Confirmed</button>
          <button type="button" class="pill-btn" id="btnMD">MD</button>
        </div>

        <div class="top-center-stack">
          <div class="utc-clock" id="utcClock">--:--:-- UTC</div>
          <form class="search-form" id="searchForm">
            <input type="text" class="search-input" id="searchInput" placeholder="Search city or state...">
            <button type="submit" class="search-go">Go</button>
          </form>
        </div>

        <div class="top-right-group">
          <button type="button" class="settings-btn" id="btnSettings">Settings ⚙️</button>
        </div>
      </header>

      <div class="map-wrap">
        <div id="map"></div>
        <div class="popup-panel" id="settingsModal">
          <div class="settings-title">Theme</div>
          <div class="option-row">
            <button type="button" class="opt-btn active" id="themeDark">Dark</button>
            <button type="button" class="opt-btn" id="themeLight">Light</button>
          </div>

          <div class="settings-title">Map Style</div>
          <div class="option-group">
            <button type="button" class="opt-btn active" id="styleDarkMinimal">Dark Minimal (Default)</button>
            <button type="button" class="opt-btn" id="styleDetailedOSM">Detailed Street (OSM)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
